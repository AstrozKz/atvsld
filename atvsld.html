-mi và Tâm lý","sub":"Hai nhóm mối nguy thường bị bỏ qua nhất nhưng ảnh hưởng lâu dài nhất","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #118577\"><div class=\"t th\" style=\"font-size:18px;font-weight:800;color:#118577\">ÉC-GÔ-NÔ-MI (Ergonomics)</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Bao gồm các mối nguy liên quan đến <b>tư thế, thao tác và gánh nặng của công việc</b>.</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#3FB5A3\"><b>Nâng, vận chuyển, mang vác vật nặng</b></div><div class=\"li dot\" style=\"--c:#3FB5A3\"><b>Cử động nhanh</b> hoặc <b>thao tác lặp đi lặp lại</b></div><div class=\"li dot\" style=\"--c:#3FB5A3\">Máy, thiết bị hoặc quy trình làm việc <b>được thiết kế không phù hợp</b> khiến NLĐ làm việc ở tư thế có hại cho sức khỏe</div></div><div class=\"m-box\" style=\"background:#edf8f6\"><div class=\"t\" style=\"font-size:13.5px;font-weight:800;color:#118577\">HẬU QUẢ TÍCH LŨY</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#118577\">Đau mỏi cổ, vai, lưng, thắt lưng</div><div class=\"li dot\" style=\"--c:#118577\">Viêm gân, viêm bao khớp, hội chứng ống cổ tay</div><div class=\"li dot\" style=\"--c:#118577\">Thoát vị đĩa đệm cột sống</div><div class=\"li dot\" style=\"--c:#118577\">Giảm lực nắm bàn tay, giảm năng suất</div></div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #7d3c98\"><div class=\"t th\" style=\"font-size:18px;font-weight:800;color:#7d3c98\">TÂM LÝ</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Là các mối nguy liên quan đến <b>tổ chức nơi làm việc, thiết kế công việc, tuyển dụng, bố trí lao động</b> không hợp lý, dẫn đến tình trạng NLĐ bị <b>căng thẳng thần kinh tâm lí, bị ức chế và trầm cảm</b>.</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#7D3C98\">Áp lực tiến độ, doanh thu — đặc biệt vào mùa nóng cao điểm</div><div class=\"li dot\" style=\"--c:#7D3C98\">Làm việc quá giờ liên tục, không được nghỉ ngơi đủ</div><div class=\"li dot\" style=\"--c:#7D3C98\">Sức ép và đòi hỏi khắt khe từ khách hàng</div><div class=\"li dot\" style=\"--c:#7D3C98\">Bị phân biệt, đối xử không công bằng tại nơi làm việc</div></div><div class=\"m-box\" style=\"background:#f4ecf7\"><div class=\"t\" style=\"font-size:13.5px;font-weight:800;color:#7d3c98\">VÒNG XOÁY NGUY HIỂM</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Căng thẳng → mất tập trung → <b>thao tác sai</b> → tai nạn lao động. Mối nguy tâm lý không trực tiếp gây thương tích, nhưng là <b>nguyên nhân gián tiếp</b> của rất nhiều vụ tai nạn.</div></div></div></div></div>"},{"k":45,"kicker":"Bài 2 · Mục 1.3","title":"Phương pháp xác định mối nguy tại nơi làm việc","sub":"","html":"<div class=\"m-box dark\" style=\"background:#0b463f\"><div class=\"t\" style=\"font-size:16px;color:#dff2ee\">Xác định mối nguy là việc làm <b style=\"color:#FFD75E\">vô cùng quan trọng</b> nhằm có biện pháp kiểm soát phù hợp. NLĐ cần coi việc này là <b style=\"color:#FFD75E\">việc làm ưu tiên, thực hiện hàng ngày như một thói quen</b>.</div></div><div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #118577\"><div class=\"m-irow\"><span class=\"m-num\" style=\"color:#118577\">01</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:16px;font-weight:800;color:#08312e\">QUAN SÁT &amp; KIỂM TRA</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Kiểm tra kỹ nơi làm việc, công cụ, máy móc, thiết bị <b>trước khi</b> và <b>trong khi</b> làm việc.</div><div class=\"m-box\" style=\"background:#edf8f6\"><div class=\"t\" style=\"font-size:13.5px;color:#118577\">Trước mỗi ca: kiểm tra dây nguồn, phích cắm, nấc thang, đồng hồ nạp gas, van bình khí.</div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #c98200\"><div class=\"m-irow\"><span class=\"m-num\" style=\"color:#c98200\">02</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:16px;font-weight:800;color:#08312e\">TRAO ĐỔI VỚI ĐỒNG NGHIỆP</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Hỏi thợ chính, người làm lâu năm về những sự cố đã từng xảy ra và các điểm cần lưu ý.</div><div class=\"m-box\" style=\"background:#edf8f6\"><div class=\"t\" style=\"font-size:13.5px;color:#c98200\">Người đi trước đã trả giá cho những bài học đó — hỏi là cách học rẻ nhất.</div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #0f6a5f\"><div class=\"m-irow\"><span class=\"m-num\" style=\"color:#0f6a5f\">03</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:16px;font-weight:800;color:#08312e\">TRA HỒ SƠ, BÁO CÁO</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Căn cứ biên bản thanh tra, kiểm tra ATVSLĐ và báo cáo tai nạn, sự cố đã xảy ra tại cơ sở.</div><div class=\"m-box\" style=\"background:#edf8f6\"><div class=\"t\" style=\"font-size:13.5px;color:#0f6a5f\">Mối nguy đã gây tai nạn một lần thì hoàn toàn có thể gây lại lần nữa.</div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #c0392b\"><div class=\"m-irow\"><span class=\"m-num\" style=\"color:#c0392b\">04</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:16px;font-weight:800;color:#08312e\">TỰ ĐẶT CÂU HỎI</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Với từng bước công việc: “Điều gì có thể gây hại ở đây? Nếu sai một bước thì hậu quả là gì?”</div><div class=\"m-box\" style=\"background:#edf8f6\"><div class=\"t\" style=\"font-size:13.5px;color:#c0392b\">Thói quen “dừng 5 giây suy nghĩ” trước khi thao tác ngăn được phần lớn tai nạn.</div></div></div></div></div>"},{"k":46,"kicker":"Bài 2 · Mục 2","title":"Thực hành: Xác định mối nguy tại nơi làm việc","sub":"Hoạt động nhóm — 35 phút","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-fig\"><div class=\"m-img\"><img data-asset=\"img-b.jpg\" alt=\"\"></div><div class=\"cap\"><div class=\"t\" style=\"font-size:15px;font-weight:600;color:#ffffff\">Quan sát ảnh: em nhìn thấy những mối nguy nào? Chúng có thể gây ra hậu quả gì?</div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c98200\">CÁCH TIẾN HÀNH</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li num\" style=\"--c:#C98200\"><span class=\"nb\">1</span><span class=\"nbt\">Chia lớp thành các nhóm nhỏ <b>4–5 em/nhóm</b>;</span></div><div class=\"li num\" style=\"--c:#C98200\"><span class=\"nb\">2</span><span class=\"nbt\">Mỗi nhóm nhận <b>1 hình ảnh</b> có các mối nguy trong nghề sửa chữa, bảo trì điện lạnh;</span></div><div class=\"li num\" style=\"--c:#C98200\"><span class=\"nb\">3</span><span class=\"nbt\">Nhóm thảo luận, ghi lên giấy A0: <b>các mối nguy cụ thể</b> có trong hình và <b>ảnh hưởng</b> của chúng đối với an toàn, sức khỏe NLĐ;</span></div><div class=\"li num\" style=\"--c:#C98200\"><span class=\"nb\">4</span><span class=\"nbt\">Đại diện nhóm <b>trình bày kết quả</b> trước lớp; giáo viên nhận xét và tổng hợp.</span></div></div></div></div></div><div class=\"m-box\" style=\"background:#fff6de;border:1px solid #f5b301\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c98200\">LƯU Ý CHO GIÁO VIÊN</div><div class=\"t\" style=\"font-size:16px;color:#4a6a66\">Phương pháp tốt nhất để thực hành xác định mối nguy là cho học sinh <b>đến tham quan và làm bài tập tại xưởng làm việc thực tế</b>. Trong trường hợp không thể sắp xếp được, việc thực hành qua tranh ảnh là <b>một giải pháp thay thế</b>.</div><div class=\"m-box\" style=\"background:#ffffff\"><div class=\"t\" style=\"font-size:15px;color:#c98200\">Mẫu bảng ghi kết quả nhóm: <b>Mối nguy quan sát được</b>  |  <b>Thuộc nhóm nào</b>  |  <b>Ảnh hưởng tới an toàn &amp; sức khỏe</b>  |  <b>Ai có thể bị ảnh hưởng</b></div></div></div>"},{"k":47,"kicker":"Bài 2 · Mục 3","title":"5 nhóm mối nguy đặc thù của nghề điện lạnh","sub":"Đây là bản đồ mối nguy em sẽ gặp mỗi ngày khi hành nghề","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #c98200\"><span class=\"m-badge emo\" style=\"background:#EDF8F6;\">🧪</span><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c98200\">HÓA CHẤT</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#C98200\">Môi chất lạnh (gas)</div><div class=\"li dot\" style=\"--c:#C98200\">Dầu bôi trơn</div><div class=\"li dot\" style=\"--c:#C98200\">Sơn cách điện</div><div class=\"li dot\" style=\"--c:#C98200\">Khói hàn</div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #c0392b\"><span class=\"m-badge emo\" style=\"background:#EDF8F6;\">⚡</span><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c0392b\">AN TOÀN</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#C0392B\">Tiếp xúc với điện</div><div class=\"li dot\" style=\"--c:#C0392B\">Làm việc với vật sắc nhọn</div><div class=\"li dot\" style=\"--c:#C0392B\">Làm việc trên cao</div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #0f6a5f\"><span class=\"m-badge emo\" style=\"background:#EDF8F6;\">🌡</span><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#0f6a5f\">VẬT LÝ</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#0F6A5F\">Bụi</div><div class=\"li dot\" style=\"--c:#0F6A5F\">Tiếng ồn</div><div class=\"li dot\" style=\"--c:#0F6A5F\">Rung động</div><div class=\"li dot\" style=\"--c:#0F6A5F\">Nguồn nhiệt</div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #118577\"><span class=\"m-badge emo\" style=\"background:#EDF8F6;\">🏃</span><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#118577\">ÉC-GÔ-NÔ-MI</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#118577\">Tư thế, vị trí làm việc bất lợi</div><div class=\"li dot\" style=\"--c:#118577\">Nâng, vận chuyển máy móc, thiết bị nặng</div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #7d3c98\"><span class=\"m-badge emo\" style=\"background:#EDF8F6;\">🧠</span><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#7d3c98\">TÂM LÝ</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#7D3C98\">Áp lực tiến độ, doanh thu</div><div class=\"li dot\" style=\"--c:#7D3C98\">Sức ép từ khách hàng</div></div></div></div></div><div class=\"m-box dark\" style=\"background:#0b463f\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffd75e\">GHI NHỚ TRƯỚC KHI ĐI SÂU TỪNG MỐI NGUY</div><div class=\"t\" style=\"font-size:16px;color:#dff2ee\">Một công việc tưởng đơn giản như <b style=\"color:#FFD75E\">nạp gas cho một chiếc điều hòa</b> có thể chứa đồng thời <b>cả 5 nhóm mối nguy</b>: hóa chất (gas), an toàn (điện, trên cao), vật lý (nhiệt, tiếng ồn), éc-gô-nô-mi (tư thế ngửa người), tâm lý (khách chờ, gấp tiến độ).</div></div>"},{"k":48,"kicker":"Bài 2 · Mục 3.1.1","title":"Mối nguy hóa chất: Môi chất lạnh (gas lạnh)","sub":"","html":"<div class=\"m-img\"><img data-asset=\"img-c.jpg\" alt=\"\"></div><div class=\"m-box dark\" style=\"background:#0b463f\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffd75e\">ĐƯỜNG XÂM NHẬP VÀO CƠ THỂ</div><div class=\"t\" style=\"font-size:16px;color:#dff2ee\">Môi chất lạnh xâm nhập vào cơ thể <b style=\"color:#FFD75E\">chủ yếu qua đường hô hấp</b>. Khi vào cơ thể, chúng có thể gây ngộ độc; gây ngạt, khó thở; gây kích ứng hay bỏng lạnh, nguy hiểm đến sức khỏe và tính mạng con người.</div><div class=\"m-grid2\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#ffffff\">Ngộ độc</div><div class=\"t\" style=\"font-size:13.5px;color:#afd3cd\">Nhiễm độc hệ thần kinh</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#ffffff\">Ngạt, khó thở</div><div class=\"t\" style=\"font-size:13.5px;color:#afd3cd\">Chiếm chỗ ôxy trong không khí</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#ffffff\">Kích ứng</div><div class=\"t\" style=\"font-size:13.5px;color:#afd3cd\">Mắt, mũi, da, niêm mạc</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#ffffff\">Bỏng lạnh</div><div class=\"t\" style=\"font-size:13.5px;color:#afd3cd\">Gas hóa hơi hạ nhiệt độ đột ngột</div></div></div></div></div><div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#fbe4e1;border:1px solid #c0392b\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c0392b\">NGUY CƠ CHÁY NỔ</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#C0392B\">Một số môi chất (đặc biệt <b>gas R600a</b>) là <b>hidrocacbon dễ cháy</b>, nguy cơ cháy nổ rất cao</div><div class=\"li dot\" style=\"--c:#C0392B\">Rò rỉ gas trong <b>không gian hẹp, kín</b> → tích tụ, gặp tia lửa hàn hoặc tia lửa điện là nổ</div><div class=\"li dot\" style=\"--c:#C0392B\">Bình gas để gần <b>nguồn nhiệt, ngọn lửa hàn</b> → tăng áp suất, nguy cơ nổ bình</div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#fff6de;border:1px solid #c98200\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c98200\">THỜI ĐIỂM DỄ TIẾP XÚC NHẤT</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#C98200\"><b>Nạp gas, thu hồi gas</b> cho hệ thống lạnh</div><div class=\"li dot\" style=\"--c:#C98200\"><b>Kiểm tra, xử lý xì hở gas</b> trên đường ống, mối hàn</div><div class=\"li dot\" style=\"--c:#C98200\"><b>Tháo, lắp, vận chuyển</b> bình gas và thiết bị còn gas</div></div></div></div></div>"},{"k":49,"kicker":"Bài 2 · Mục 3.1.1.1","title":"Nhận diện các loại môi chất lạnh thường dùng","sub":"","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb\"><div class=\"m-box dark\" style=\"background:#c0392b\"><div class=\"t th\" style=\"font-size:18px;font-weight:800;color:#ffffff\">GAS R12</div></div><div class=\"t\" style=\"font-size:15px;font-weight:600;color:#c0392b\">Loại gas lâu đời nhất</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#C0392B\">Bình thường có <b>mùi hôi</b></div><div class=\"li dot\" style=\"--c:#C0392B\">Khi đốt có <b>màu xanh lá và mùi hắc</b></div><div class=\"li dot\" style=\"--c:#C0392B\"><b>Gây độc hại</b> cho con người nếu tiếp xúc</div><div class=\"li dot\" style=\"--c:#C0392B\"><b>Nguy hiểm cho tầng Ozon</b> → đã bị loại bỏ</div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb\"><div class=\"m-box\" style=\"background:#c98200\"><div class=\"t th\" style=\"font-size:18px;font-weight:800;color:#ffffff\">GAS R134a</div></div><div class=\"t\" style=\"font-size:15px;font-weight:600;color:#c98200\">Được tạo ra để thay thế R12</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#C98200\">Dùng phổ biến cho tủ lạnh, điều hòa xe hơi</div><div class=\"li dot\" style=\"--c:#C98200\"><b>Vẫn nguy hại tới sức khỏe</b> nếu tiếp xúc</div><div class=\"li dot\" style=\"--c:#C98200\">Bị hạn chế sử dụng tại châu Âu</div><div class=\"li dot\" style=\"--c:#C98200\">Gây ngạt khi nồng độ cao</div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb\"><div class=\"m-box dark\" style=\"background:#0f6a5f\"><div class=\"t th\" style=\"font-size:18px;font-weight:800;color:#ffffff\">GAS R404</div></div><div class=\"t\" style=\"font-size:15px;font-weight:600;color:#0f6a5f\">Chuyên dùng cho tủ cấp đông</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#0F6A5F\">Dùng cho kho lạnh, tủ cấp đông công nghiệp</div><div class=\"li dot\" style=\"--c:#0F6A5F\">Gây <b>ngộ độc</b>, sốc</div><div class=\"li dot\" style=\"--c:#0F6A5F\">Gây <b>mất tập trung</b></div><div class=\"li dot\" style=\"--c:#0F6A5F\">Nguy hiểm trong không gian kín</div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb\"><div class=\"m-box dark\" style=\"background:#7d3c98\"><div class=\"t th\" style=\"font-size:18px;font-weight:800;color:#ffffff\">GAS R600a</div></div><div class=\"t\" style=\"font-size:15px;font-weight:600;color:#7d3c98\">Dùng cho tủ lạnh cao cấp</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#7D3C98\">Là gas <b>hidrocacbon</b> (isobutan)</div><div class=\"li dot\" style=\"--c:#7D3C98\"><b>Có thể gây cháy, nổ cao</b></div><div class=\"li dot\" style=\"--c:#7D3C98\">Ảnh hưởng tới an toàn, sức khỏe và tài sản</div><div class=\"li dot\" style=\"--c:#7D3C98\"><b>Tuyệt đối tránh nguồn lửa</b> khi làm việc</div></div></div></div></div><div class=\"m-box\" style=\"background:#fbe4e1;border:1px solid #c0392b\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c0392b\">QUY TẮC VÀNG KHI LÀM VIỆC VỚI GAS LẠNH</div><div class=\"m-grid2\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff\"><div class=\"t\" style=\"font-size:13.5px\">Luôn <b>biết rõ loại gas</b> mình đang làm việc với</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff\"><div class=\"t\" style=\"font-size:13.5px\">Gas R600a → <b>tuyệt đối không có lửa</b> trong khu vực</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff\"><div class=\"t\" style=\"font-size:13.5px\">Không bao giờ làm việc với gas trong <b>không gian kín</b></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff\"><div class=\"t\" style=\"font-size:13.5px\">Luôn <b>đứng đầu hướng gió</b>, đeo kính và găng tay</div></div></div></div></div>"},{"k":50,"kicker":"Bài 2 · Mục 3.1.1.2","title":"Ảnh hưởng của môi chất lạnh tới sức khỏe","sub":"","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #1e8449\"><div class=\"m-box dark\" style=\"background:#1e8449\"><div class=\"t th\" style=\"font-size:16px;font-weight:800;color:#ffffff\">MỨC ĐỘ NHẸ</div></div><div class=\"t\" style=\"font-size:15px;font-weight:600;color:#1e8449\">Tiếp xúc nồng độ thấp, thời gian ngắn</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#1E8449\">Kích ứng mắt, chảy nước mắt</div><div class=\"li dot\" style=\"--c:#1E8449\">Kích ứng mũi, họng, ho</div><div class=\"li dot\" style=\"--c:#1E8449\">Chóng mặt nhẹ, hơi khó thở</div><div class=\"li dot\" style=\"--c:#1E8449\">Da khô, đỏ tại vùng tiếp xúc</div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #c98200\"><div class=\"m-box\" style=\"background:#c98200\"><div class=\"t th\" style=\"font-size:16px;font-weight:800;color:#ffffff\">MỨC ĐỘ TRUNG BÌNH</div></div><div class=\"t\" style=\"font-size:15px;font-weight:600;color:#c98200\">Tiếp xúc nồng độ cao hoặc kéo dài</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#C98200\">Đau đầu, buồn nôn, nôn</div><div class=\"li dot\" style=\"--c:#C98200\">Mất tập trung, phản ứng chậm</div><div class=\"li dot\" style=\"--c:#C98200\">Khó thở rõ rệt, tức ngực</div><div class=\"li dot\" style=\"--c:#C98200\">Bỏng lạnh cấp độ 1–2 khi gas phun trực tiếp</div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #c0392b\"><div class=\"m-box dark\" style=\"background:#c0392b\"><div class=\"t th\" style=\"font-size:16px;font-weight:800;color:#ffffff\">MỨC ĐỘ NẶNG</div></div><div class=\"t\" style=\"font-size:15px;font-weight:600;color:#c0392b\">Nồng độ rất cao, không gian kín</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#C0392B\"><b>Ngạt do thiếu ôxy</b>, mất ý thức</div><div class=\"li dot\" style=\"--c:#C0392B\">Ngộ độc hệ thần kinh, co giật</div><div class=\"li dot\" style=\"--c:#C0392B\"><b>Rối loạn nhịp tim</b>, ngừng tim</div><div class=\"li dot\" style=\"--c:#C0392B\"><b>Bỏng lạnh cấp độ 3</b>, hoại tử — <b>có thể tử vong</b></div></div></div></div><div class=\"m-cell\"><div class=\"m-box dark\" style=\"background:#0b463f\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffd75e\">DẤU HIỆU CẢNH BÁO KHI ĐANG LÀM VIỆC</div><div class=\"t\" style=\"font-size:15px;color:#dff2ee\"><div class=\"li dot\" style=\"--c:#F5B301\">Nghe <b>tiếng xì</b> nhỏ liên tục ở mối hàn, van</div><div class=\"li dot\" style=\"--c:#F5B301\">Thấy <b>hơi lạnh trắng</b> phun ra hoặc sương đóng tuyết bất thường</div><div class=\"li dot\" style=\"--c:#F5B301\">Bất ngờ <b>chóng mặt, đau đầu, khó thở</b> khi đang làm việc</div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#fbe4e1;border:1px solid #c0392b\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c0392b\">PHẢI LÀM GÌ NGAY?</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\"><div class=\"li num\" style=\"--c:#C0392B\"><span class=\"nb\">1</span><span class=\"nbt\"><b>Ngừng việc ngay</b>, ra khỏi khu vực, tới nơi thoáng khí</span></div><div class=\"li num\" style=\"--c:#C0392B\"><span class=\"nb\">2</span><span class=\"nbt\">Báo cho người phụ trách; <b>tuyệt đối không bật/tắt thiết bị điện</b> trong khu vực nghi rò gas</span></div><div class=\"li num\" style=\"--c:#C0392B\"><span class=\"nb\">3</span><span class=\"nbt\">Nếu có người bất tỉnh: gọi cấp cứu <b>115</b>, không tự lao vào khu vực kín</span></div></div></div></div></div>"},{"k":51,"kicker":"Bài 2 · Mục 3.1.1","title":"Bỏng lạnh — 3 cấp độ tổn thương","sub":"Xảy ra khi gas lạnh phun trực tiếp vào da, mắt hoặc khi tiếp xúc bề mặt kim loại quá lạnh","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #1e8449\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:#1E8449;color:#fff;\">1</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:16px;font-weight:800;color:#1e8449\">CẤP ĐỘ 1</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Tổn thương bề mặt da</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#1E8449\">Ngứa, đau rát</div><div class=\"li dot\" style=\"--c:#1E8449\">Biến đổi sắc tố da: <b>trắng hoặc vàng</b></div><div class=\"li dot\" style=\"--c:#1E8449\">Gây rối loạn hoặc <b>mất cảm giác</b></div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #c98200\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:#C98200;color:#fff;\">2</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:16px;font-weight:800;color:#c98200\">CẤP ĐỘ 2</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Tổn thương sâu hơn, có bọng nước</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#C98200\">Xuất hiện <b>các bọng nước</b> tại vùng da tổn thương</div><div class=\"li dot\" style=\"--c:#C98200\">Da <b>cứng và đổi màu sậm đen</b></div><div class=\"li dot\" style=\"--c:#C98200\"><b>Mất cảm giác</b> tại vùng bị tổn thương</div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #c0392b\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:#C0392B;color:#fff;\">3</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:16px;font-weight:800;color:#c0392b\">CẤP ĐỘ 3</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Bỏng lạnh nặng, nghiêm trọng</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#C0392B\">Bỏng tới <b>các lớp mô sâu, gân, cơ, mạch máu, thần kinh</b></div><div class=\"li dot\" style=\"--c:#C0392B\">Vùng tổn thương <b>chuyển màu đen</b></div><div class=\"li dot\" style=\"--c:#C0392B\"><b>Dễ hoại tử</b> do thiếu dinh dưỡng</div><div class=\"li dot\" style=\"--c:#C0392B\">Nguy cơ <b>bội nhiễm vi khuẩn</b></div></div></div></div></div><div class=\"m-box\" style=\"background:#fbe4e1;border:1px solid #c0392b\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c0392b\">GHI NHỚ: BỎNG LẠNH KHÁC BỎNG NHIỆT</div><div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#0f6a5f\">Bỏng lạnh</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Do gas hóa hơi hạ nhiệt độ cực thấp. Sơ cứu: <b>LÀM ẤM</b> bằng nước 38–42°C</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c98200\">Bỏng nhiệt</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Do ngọn lửa hàn, ống nóng. Sơ cứu: <b>LÀM MÁT</b> dưới vòi nước 10–15 phút</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c0392b\">Điểm chung</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Đều <b>không tự ý bôi thuốc, kem đánh răng</b>; không chọc vỡ bọng nước</div></div></div></div></div>"},{"k":52,"kicker":"Bài 2 · Mục 3.1.2 – 3.1.3","title":"Dầu bôi trơn và Sơn cách điện","sub":"","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #c98200\"><div class=\"t th\" style=\"font-size:18px;font-weight:800;color:#c98200\">DẦU BÔI TRƠN</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Dùng cho máy nén. NLĐ tiếp xúc khi <b>thay dầu, thải bỏ dầu thải, sửa máy nén</b>. Dầu phát tán hơi mùi trong không gian làm việc.</div><div class=\"t\" style=\"font-size:13.5px;font-weight:800;color:#c98200\">ẢNH HƯỞNG TỚI SỨC KHỎE</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#F5B301\">Gây <b>buồn nôn</b></div><div class=\"li dot\" style=\"--c:#F5B301\">Gây <b>mất tập trung</b></div><div class=\"li dot\" style=\"--c:#F5B301\"><b>Giảm trí nhớ</b></div><div class=\"li dot\" style=\"--c:#F5B301\">Ảnh hưởng <b>hệ thần kinh</b></div><div class=\"li dot\" style=\"--c:#F5B301\"><b>Suy giảm thị lực</b></div><div class=\"li dot\" style=\"--c:#F5B301\"><b>Suy thận</b> (do thành phần ethylene glycol)</div></div><div class=\"m-box\" style=\"background:#fff6de\"><div class=\"t\" style=\"font-size:13.5px;color:#c98200\">Dầu thải là <b>chất thải nguy hại</b> — không được đổ ra môi trường, cống rãnh; phải thu gom đúng quy định.</div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #7d3c98\"><div class=\"t th\" style=\"font-size:18px;font-weight:800;color:#7d3c98\">SƠN CÁCH ĐIỆN</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Dùng để cách điện cuộn dây động cơ, máy nén sau khi sửa chữa, quấn lại dây. Chứa <b>dung môi hữu cơ bay hơi mạnh</b>.</div><div class=\"t\" style=\"font-size:13.5px;font-weight:800;color:#7d3c98\">ẢNH HƯỞNG TỚI SỨC KHỎE</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#7D3C98\"><b>Khó thở, tức ngực</b></div><div class=\"li dot\" style=\"--c:#7D3C98\"><b>Đau đầu, buồn nôn</b></div><div class=\"li dot\" style=\"--c:#7D3C98\"><b>Giảm trí nhớ, mất tập trung</b></div><div class=\"li dot\" style=\"--c:#7D3C98\"><b>Viêm mũi, hen phế quản</b></div><div class=\"li dot\" style=\"--c:#7D3C98\">Ảnh hưởng <b>hệ thần kinh</b></div><div class=\"li dot\" style=\"--c:#7D3C98\">Gây <b>thiếu máu</b></div></div><div class=\"m-box\" style=\"background:#f4ecf7\"><div class=\"t\" style=\"font-size:13.5px;color:#7d3c98\">Chỉ sơn ở nơi <b>thông thoáng</b> hoặc có hút khí cục bộ; luôn đeo <b>khẩu trang lọc độc</b>, không dùng khẩu trang y tế thường.</div></div></div></div></div>"},{"k":53,"kicker":"Bài 2 · Mục 3.1.4","title":"Mối nguy hóa chất: Khói hàn","sub":"","html":"<div class=\"m-img\"><img data-asset=\"img-e.jpg\" alt=\"\"></div><div class=\"m-box dark\" style=\"background:#0b463f\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffd75e\">KHÓI HÀN SINH RA KHI NÀO?</div><div class=\"t\" style=\"font-size:15px;color:#dff2ee\">Khi <b style=\"color:#FFD75E\">hàn ống đồng, hàn đầu rắc co vào đầu nạp của máy nén</b> tủ lạnh, hàn các mối nối trên đường ống môi chất — nhiệt độ ngọn lửa hàn rất lớn làm kim loại và que hàn bốc hơi.</div><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffd75e\">THÀNH PHẦN ĐỘC HẠI</div><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffd75e\">CO</div><div class=\"t\" style=\"font-size:13.5px;color:#dff2ee\">Cacbon monoxit — gây ngạt, nhiễm độc máu</div></div><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffd75e\">CO₂</div><div class=\"t\" style=\"font-size:13.5px;color:#dff2ee\">Cacbon dioxit — chiếm chỗ ôxy</div></div><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffd75e\">Fosgen</div><div class=\"t\" style=\"font-size:13.5px;color:#dff2ee\">Khí cực độc, sinh ra khi gas gặp nhiệt cao</div></div></div><div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#fff6de;border:1px solid #c98200\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c98200\">ẢNH HƯỞNG KHI TIẾP XÚC LÂU NGÀY</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#C98200\">Dễ bị <b>ho</b>, <b>viêm đường hô hấp</b></div><div class=\"li dot\" style=\"--c:#C98200\"><b>Viêm phế quản</b></div><div class=\"li dot\" style=\"--c:#C98200\"><b>Bệnh về mắt</b></div><div class=\"li dot\" style=\"--c:#C98200\">Bị <b>xạm da</b></div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#fbe4e1;border:1px solid #c0392b\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c0392b\">ĐẶC BIỆT LƯU Ý — KHÍ FOSGEN</div><div class=\"t\" style=\"font-size:15px\">Khi <b>môi chất lạnh còn sót trong hệ thống gặp ngọn lửa hàn nhiệt độ cao</b>, gas có thể phân hủy tạo ra <b>khí Fosgen</b> — loại khí cực độc. Vì vậy <b>bắt buộc phải thu hồi hết gas</b> và thông thoáng khu vực <b>trước khi hàn</b>.</div></div></div></div>"},{"k":54,"kicker":"Bài 2 · Mục 3.2.1","title":"Mối nguy an toàn: Tiếp xúc với điện","sub":"Mối nguy gây tử vong nhanh nhất trong nghề điện lạnh","html":"<div class=\"m-img\"><img data-asset=\"img-d.jpg\" alt=\"\"></div><div class=\"m-box\" style=\"background:#fbe4e1;border:1px solid #c0392b\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c0392b\">3 DẠNG NGUY HIỂM CỦA ĐIỆN</div><div class=\"m-box\" style=\"background:#ffffff\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c0392b\">Điện giật</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Dòng điện đi qua cơ thể khi tiếp xúc phần mang điện</div></div><div class=\"m-box\" style=\"background:#ffffff\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c0392b\">Cháy nổ</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Ngắn mạch, quá tải làm phát sinh tia lửa gây cháy</div></div><div class=\"m-box\" style=\"background:#ffffff\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c0392b\">Hồ quang điện</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Phóng điện qua không khí, nhiệt độ cực cao gây bỏng nặng</div></div></div><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c0392b\">3 TÁC ĐỘNG CỦA DÒNG ĐIỆN LÊN CƠ THỂ NGƯỜI</div><div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #c0392b\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c0392b\">TÁC ĐỘNG SINH LÝ</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Gây <b>co giật cơ</b>, làm nạn nhân không tự rời được vật mang điện; gây <b>rung tim</b>, rối loạn nhịp tim, tê liệt hô hấp → nguyên nhân tử vong chính.</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #c98200\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c98200\">TÁC ĐỘNG NHIỆT</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Dòng điện qua cơ thể sinh nhiệt gây <b>bỏng</b> tại điểm vào và điểm ra; bỏng điện thường <b>sâu, khó lành</b> hơn bỏng nhiệt thông thường.</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #0f6a5f\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#0f6a5f\">TÁC ĐỘNG ĐIỆN PHÂN</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Dòng điện <b>phân hủy máu</b> và các dịch trong cơ thể, làm thay đổi thành phần hóa học của tế bào và tổ chức cơ thể.</div></div></div></div>"},{"k":55,"kicker":"Bài 2 · Mục 3.2.1","title":"Tác động của cường độ dòng điện lên cơ thể","sub":"Chỉ cần vài chục mA là đủ gây tử vong — không phải điện áp, mà CƯỜNG ĐỘ dòng điện mới giết người","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-tblw\"><table class=\"m-tbl\"><tbody><tr><td style=\"background:#0F6A5F;color:#fff;font-weight:700\">Cường độ dòng điện</td><td style=\"background:#0F6A5F;color:#fff;font-weight:700\">Tác động lên cơ thể người</td></tr><tr><td style=\"background:#E4F4E9;color:#1E8449;font-weight:800\">0,6 – 1,5 mA</td><td style=\"background:#E4F4E9;color:#14312E\">Bắt đầu tê ngón tay</td></tr><tr><td style=\"background:#E4F4E9;color:#1E8449;font-weight:800\">2 – 3 mA</td><td style=\"background:#E4F4E9;color:#14312E\">Ngón tay tê mạnh</td></tr><tr><td style=\"background:#FFF6DE;color:#C98200;font-weight:800\">5 – 7 mA</td><td style=\"background:#FFF6DE;color:#14312E\">Bắp thịt co lại và rung</td></tr><tr><td style=\"background:#FFF6DE;color:#C98200;font-weight:800\">8 – 10 mA</td><td style=\"background:#FFF6DE;color:#14312E\">Tay khó rời vật mang điện</td></tr><tr><td style=\"background:#FBE4E1;color:#C0392B;font-weight:800\">20 – 25 mA</td><td style=\"background:#FBE4E1;color:#14312E\">Tay không rời được vật mang điện, đau nhiều :"","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #c0392b\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#08312e\">Ba via ống đồng</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Sau khi cắt, mép ống đồng rất sắc; nạo ba via dễ đứt tay</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #c98200\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#08312e\">Mũi khoan, máy khoan</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Mũi khoan quay tốc độ cao, kẹt vào tay, quần áo; mảnh vụn bay vào mắt</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #0f6a5f\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#08312e\">Mép tôn, vỏ máy</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Cạnh tôn vỏ dàn lạnh, dàn nóng, lưới bảo vệ rất sắc</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #7d3c98\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#08312e\">Que hàn, đầu ống cắt dở</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Mẩu que hàn, đầu ống đồng vụn nằm rải trên sàn gây đạp phải, xước chân</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #c0392b\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#08312e\">Dao, kìm, tuốc nơ vít</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Dụng cụ cầm tay sắc nhọn; trượt tay khi dùng lực lớn</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #c98200\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#08312e\">Mảnh kính, vụn kim loại</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Bay vào mắt khi mài, cắt, khoan mà không đeo kính bảo hộ</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#fbe4e1;border:1px solid #c0392b\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c0392b\">HẬU QUẢ CÓ THỂ XẢY RA</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#C0392B\"><b>Rách da, chảy máu</b> ở tay, chân</div><div class=\"li dot\" style=\"--c:#C0392B\"><b>Chấn thương mắt</b> do mảnh vụn bay vào — có thể mù</div><div class=\"li dot\" style=\"--c:#C0392B\">Đứt gân, tổn thương thần kinh ngón tay</div><div class=\"li dot\" style=\"--c:#C0392B\"><b>Nhiễm trùng, uốn ván</b> nếu vết thương bẩn không xử lý đúng</div></div></div></div><div class=\"m-cell\"><div class=\"m-box dark\" style=\"background:#0b463f\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffd75e\">TÌNH HUỐNG THỰC TẾ HAY GẶP</div><div class=\"t\" style=\"font-size:15px;color:#dff2ee\"><div class=\"li dot\" style=\"--c:#F5B301\">Nạo ba via ống đồng <b>bằng tay không</b> để “cho nhanh”</div><div class=\"li dot\" style=\"--c:#F5B301\">Khoan tường <b>không đeo kính</b>, bụi và mảnh vữa bay vào mắt</div><div class=\"li dot\" style=\"--c:#F5B301\">Để mẩu ống đồng, que hàn <b>rải rác trên sàn</b> rồi đạp phải</div><div class=\"li dot\" style=\"--c:#F5B301\">Luồn tay vào <b>khe quạt dàn nóng</b> khi quạt chưa dừng hẳn</div></div></div></div></div>"},{"k":57,"kicker":"Bài 2 · Mục 3.2.3","title":"Mối nguy an toàn: Làm việc trên cao","sub":"Nguyên nhân hàng đầu gây tai nạn chết người trong lắp đặt, bảo trì điều hòa","html":"<div class=\"m-img\"><img data-asset=\"img-f.jpg\" alt=\"\"></div><div class=\"m-box\" style=\"background:#fbe4e1;border:1px solid #c0392b\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c0392b\">VỊ TRÍ LÀM VIỆC TRÊN CAO TRONG NGHỀ ĐIỆN /div><div class=\"t\" style=\"font-size:15px;color:#dff2ee\"><div class=\"li dot\" style=\"--c:#F5B301\">Thang <b>gãy nấc, kê không chắc</b>, đặt trên sàn trơn</div><div class=\"li dot\" style=\"--c:#F5B301\"><b>Không dùng dây/đai an toàn</b> khi làm ở độ cao</div><div class=\"li dot\" style=\"--c:#F5B301\"><b>Nhoài người, dướn với</b> quá tầm để đỡ phải di chuyển thang</div><div class=\"li dot\" style=\"--c:#F5B301\">Làm việc <b>một mình</b>, không có người giữ thang, mái tôn mục</div></div></div></div></div>"},{"k":58,"kicker":"Bài 2 · Mục 3.3.1","title":"Mối nguy vật lý: Tiếp xúc với bụi","sub":"","html":"<div class=\"m-box dark\" style=\"background:#0b463f\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffd75e\">BỤI PHÁT SINH KHI NÀO?</div><div class=\"t\" style=\"font-size:16px;color:#dff2ee\">Bụi phát sinh khi người lao động <b style=\"color:#FFD75E\">cắt ống đồng, nạo ba via, mài nhẵn mặt cắt, khoan tường lắp đặt thiết bị, làm vệ sinh lưới lọc, vệ sinh mặt nạ, vỏ máy</b>.</div></div><div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #c0392b\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#c0392b\">Bụi khoáng</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Bụi vữa, xi măng, bê tông khi khoan tường — chứa silic</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #c98200\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#c98200\">Bụi kim loại</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Mạt đồng, mạt sắt khi cắt, mài, nạo ba via</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #1e8449\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#1e8449\">Bụi hữu cơ</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Bụi bẩn, nấm mốc tích tụ trong lưới lọc, dàn lạnh</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #0f6a5f\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#0f6a5f\">Bụi sợi</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Bụi bông, sợi cách nhiệt, xốp bảo ôn đường ống</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#fbe4e1;border:1px solid #c0392b\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c0392b\">ẢNH HƯỞNG TỚI SỨC KHỎE</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#C0392B\">Gây <b>viêm mũi</b>, viêm xoang</div><div class=\"li dot\" style=\"--c:#C0392B\"><b>Xước giác mạc</b> khi bụi bay vào mắt</div><div class=\"li dot\" style=\"--c:#C0392B\"><b>Viêm đường hô hấp</b>, ho, khó thở</div><div class=\"li dot\" style=\"--c:#C0392B\"><b>Bụi phổi silic nghề nghiệp</b> — chiếm 10,2% số ca BNN tại Việt Nam năm 2017</div><div class=\"li dot\" style=\"--c:#C0392B\">Dị ứng, viêm da khi bụi bám lâu trên da</div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #0f6a5f\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#0f6a5f\">ĐIỀU ÍT AI NGHĨ TỚI</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Bụi <b>không gây hậu quả ngay</b> nên rất dễ bị bỏ qua. Nhưng bụi phổi là bệnh <b>không thể chữa khỏi</b> — phổi đã xơ hóa thì không hồi phục được.<br/><br/>Một chiếc khẩu trang chống bụi đúng chuẩn chỉ tốn vài nghìn đồng, nhưng bảo vệ em cả đời làm nghề. Khẩu trang y tế mỏng <b>không đủ</b> chặn bụi mịn khi khoan tường.</div></div></div></div>"},{"k":59,"kicker":"Bài 2 · Mục 3.3.2","title":"Mối nguy vật lý: Tiếp xúc với tiếng ồn","sub":"","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box dark\" style=\"background:#0b463f\"><div
