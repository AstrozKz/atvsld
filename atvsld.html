<script>
(function(){
"use strict";
// ---------- storage ----------
const SKEY='atvsld_hoc_v1';
let S={};
function load(){try{S=JSON.parse(localStorage.getItem(SKEY)||'{}')||{}}catch(e){S={}}
  S.seen=S.seen||{};S.ex=S.ex||{};S.myQs=S.myQs||[];S.outbox=S.outbox||[];S.fz=S.fz||1;S.chk=S.chk||{};
  if(!S.profile){try{const p=JSON.parse(localStorage.getItem('atvsld_profile')||'null');if(p)S.profile=p;}catch(e){}}
  S.profile=S.profile||{ten:'',lop:'',key:''};
  if(!S.profile.key)S.profile.key='HS'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(S));localStorage.setItem('atvsld_profile',JSON.stringify(S.profile))}catch(e){}}
load();
// ---------- helpers ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const SL=DATA.slides, LS=DATA.lessons, QZ=DATA.quiz, CD=DATA.cards;
const slideById={};SL.forEach((s,i)=>{s.i=i;slideById[s.k]=s});
function lessonOf(k){return LS.find(l=>l.slides.includes(k))}
const URLS={};
for(const k in IMG){try{const b=atob(IMG[k]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);URLS[k]=URL.createObjectURL(new Blob([a],{type:'image/jpeg'}));}catch(e){}}
function fixImgs(root){root.querySelectorAll('img[data-asset]').forEach(im=>{const u=URLS[im.getAttribute('data-asset')];if(u)im.src=u;else im.closest('.m-img')&&im.closest('.m-img').remove();});}
function toast(t,ms){const o=document.querySelector('.toast');if(o)o.remove();const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),ms||2600)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function lessonProgress(l){const n=l.slides.filter(k=>S.seen[k]).length;return {n,t:l.slides.length,p:l.slides.length?n/l.slides.length:0}}
function fmtDate(t){if(!t)return'';const d=new Date(t);if(isNaN(d))return String(t);return d.toLocaleDateString('vi-VN')+' '+d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})}
const IC={

};
function ring(p,col){const r=18,c=2*Math.PI*r;return `<svg class="ring" viewBox="0 0 44 44"><circle cx="22" cy="22" r="${r}" fill="none" stroke="#E3EEEB" stroke-width="5"/><circle cx="22" cy="22" r="${r}" fill="none" stroke="${col||'#118577'}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" transform="rotate(-90 22 22)"/><text x="22" y="26" text-anchor="middle" font-size="11" font-weight="800" fill="#0B463F">${Math.round(p*100)}%</text></svg>`}
// ---------- network ----------
function hasApi(){return /^https:\/\/script\.google(usercontent)?\.com\//.test(API_URL)}
function fetchT(url,opt,ms){return Promise.race([fetch(url,opt),new Promise((_,rj)=>setTimeout(()=>rj(new Error('timeout')),ms||15000))])}
async function apiGet(params){const u=API_URL+'?'+new URLSearchParams(params).toString();const r=await fetchT(u,{method:'GET',redirect:'follow'},15000);return r.json()}
async function apiPost(obj){
  try{const r=await fetchT(API_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(obj)},20000);return await r.json()}
  catch(e){ if(String(e.message)==='timeout')throw e;
    await fetchT(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(obj)},20000);
    return {ok:true,unconfirmed:true}; }
}
function enqueue(payload){payload.uid=payload.uid||uid();S.outbox.push({p:payload,t:Date.now()});save();flush();return payload.uid}
let flushing=false;
async function flush(){
  if(flushing||!hasApi()||!S.outbox.length)return;flushing=true;
  try{
    while(S.outbox.length){const it=S.outbox[0];
      try{const r=await apiPost(it.p);if(r&&r.ok===false&&r.fatal){S.outbox.shift();}else if(r&&r.ok){S.outbox.shift();markSent(it.p.uid,r)}else break;save();}
      catch(e){break}}
  }finally{flushing=false;render(true)}
}
function markSent(u,r){S.ex&&Object.values(S.ex).forEach(e=>{(e.hist||[]).forEach(h=>{if(h.uid===u)h.sent=r.unconfirmed?'u':'y'})});S.myQs.forEach(q=>{if(q.uid===u)q.sent=r.unconfirmed?'u':'y'})}
function isQueued(u){return S.outbox.some(o=>o.p.uid===u)}
window.addEventListener('online',flush);
async function pullTeacher(){
  if(!hasApi())return;
  try{const r=await apiGet({action:'thongbao'});if(r&&r.ok){S.ann=r.items||[];S.annAt=Date.now();save();}}catch(e){}
  if(S.myQs.length){try{const r=await apiGet({action:'hopthu',key:S.profile.key});if(r&&r.ok){let changed=false;(r.items||[]).forEach(it=>{const q=S.myQs.find(x=>x.uid===it.uid);if(q&&it.reply&&q.reply!==it.reply){q.reply=it.reply;q.repliedAt=it.repliedAt;q.read=false;changed=true}});if(changed){save();toast('Giáo viên đã trả lời câu hỏi của em!')}}}catch(e){}}
  render(true);
}

function go(h){h=String(h||'home').replace(/^#/,'');if(h===CUR){render();return}CUR=h;
  if(CAN_URL){try{history.pushState(null,'','#'+h)}catch(e){}}render()}
function parse(){const m=CUR.match(/^([a-z]+)(?:-(\d+))?(?:-(\w+))?$/);route=m?m[1]:'home';param=m&&m[2]!=null?+m[2]:null;return m&&m[3]}

window.addEventListener('popstate',syncFromUrl);window.addEventListener('hashchange',syncFromUrl);
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a||e.defaultPrevented)return;e.preventDefault();go(a.getAttribute('href'))},true);

function vCards(d){
  if(d==null)return bar('Thẻ ghi nhớ','Đọc mặt trước → tự nhớ → lật thẻ',false)+`<main class="page">${CD.map((dk,j)=>`<a class="card les" href="#cards-${j}"><div class="num" style="background:${['#118577','#C98200','#0F6A5F','#7D3C98'][j%4]}">${dk.cards.length}</div><div class="grow"><div class="ti">${esc(dk.name)}</div><div class="su">${dk.cards.length} thẻ</div></div></a>`).join('')}<p class="mut" style="text-align:center">Mẹo: nhìn mặt trước, tự nói to nội dung em nhớ, rồi chạm để lật thẻ kiểm tra.</p></main>`+tabs('cards');
  const dk=CD[d];if(!dk)return vCards();if(FC.d!==d){FC={d,i:0,flip:false}}const c=dk.cards[FC.i];
  return bar(dk.name,`Thẻ ${FC.i+1}/${dk.cards.length}`,true)+`<main class="page noTab"><div class="pbar lt" style="margin:2px 0 10px"><i style="width:${(FC.i+1)/dk.cards.length*100}%"></i></div>
  <div class="fc ${FC.flip?'flip':''}" data-act="flip"><div class="in"><div class="f"><div class="nn">ĐIỀU ${esc(c.n)}</div><h3>${esc(c.f)}</h3><div class="hint">Chạm để lật thẻ</div></div><div class="b"><div class="nn" style="color:var(--t6)">ĐIỀU ${esc(c.n)} · ${esc(c.f)}</div><p style="margin-top:12px">${esc(c.b)}</p><div class="hint" style="color:var(--soft)">Chạm để lật lại</div></div></div></div>
  </main><nav class="nav"><div class="in"><button class="btn ln" data-act="fcprev" ${FC.i?'':'disabled'}>◀</button><button class="mid" data-act="fcshuf">🔀 Trộn thẻ</button><button class="btn" data-act="fcnext">${FC.i<dk.cards.length-1?'Tiếp ▶':'Từ đầu ↺'}</button></div></nav>`;
}
// ---------- ask teacher ----------
function vAsk(){
  S.myQs.forEach(q=>{if(q.reply)q.read=true});save();
  const items=S.myQs.slice().reverse();
  return bar('Hỏi thầy cô','Câu hỏi của em và trả lời của giáo viên',false)+`<main class="page">
  <button class="btn am bk" data-act="ask" data-ctx="Câu hỏi chung">✏️ Đặt câu hỏi mới</button>
  ${hasApi()?`<button class="btn gh bk" style="margin-top:8px" data-act="refresh">↻ Kiểm tra trả lời mới</button>`:`<p class="mut" style="margin-top:12px">Giáo viên chưa kết nối Google Sheet nên câu hỏi chỉ được lưu trên máy. Em có thể hỏi trực tiếp trên lớp.</p>`}
  <div class="h2">Câu hỏi đã gửi (${items.length})</div>
  ${items.length?items.map(q=>`<div class="card msg"><div class="ctx">${esc(q.ctx||'Câu hỏi')}</div><div class="q">${esc(q.text)}</div>
   <div class="row" style="margin-top:8px"><span class="mut grow" style="font-size:12px">${fmtDate(q.at)}</span>${q.reply?'<span class="chipS ok">Đã trả lời</span>':(q.sent==='y'||q.sent==='u')?'<span class="chipS">Đã gửi · chờ trả lời</span>':isQueued(q.uid)?'<span class="chipS wa">⏳ Chờ gửi</span>':'<span class="chipS">Lưu trên máy</span>'}</div>
   ${q.reply?`<div class="rep"><b>👩‍🏫 Giáo viên trả lời${q.repliedAt?' · '+esc(fmtDate(q.repliedAt)):''}</b>${esc(q.reply)}</div>`:''}</div>`).join(''):`<div class="empty">Chưa có câu hỏi nào.<br>Khi đọc bài hoặc làm bài tập, bấm <b>“Hỏi”</b> để gửi câu hỏi cho giáo viên.</div>`}
  </main>`+tabs('ask');
}
// ---------- sheets ----------
function closeSheet(){const o=document.querySelector('.ov');if(o)o.remove()}
function sheet(html){closeSheet();const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="sh"><div class="grab"></div>${html}</div>`;o.addEventListener('click',e=>{if(e.target===o)closeSheet()});document.body.appendChild(o);return o}
function profileSheet(then){
  const p=S.profile;const o=sheet(`<h3>Thông tin học sinh</h3><p class="mut" style="margin:0">Giáo viên dùng thông tin này để ghi nhận bài tập và trả lời câu hỏi của em.</p>
  <label class="fld"><span>Họ và tên</span><input id="pTen" value="${esc(p.ten)}" placeholder="VD: Nguyễn Văn An" autocomplete="name"></label>
  <label class="fld"><span>Lớp</span><input id="pLop" value="${esc(p.lop)}" placeholder="VD: KTML K15"></label>
  <button class="btn bk" id="pSave">Lưu</button>
  <div style="margin-top:18px;border-top:1px solid #E6EFED;padding-top:12px" class="mut">Tác giả bài giảng: Huỳnh Hào Kiệt · Trường Trung cấp nghề Diên Khánh.<br>Nội dung biên soạn theo Tài liệu ATVSLĐ lồng ghép trong chương trình đào tạo nghề sửa chữa, bảo trì Điện lạnh (ILO – SafeYouth@Work, 2018).</div>`);
  o.querySelector('#pSave').onclick=()=>{const t=o.querySelector('#pTen').value.trim().replace(/\s+/g,' ');const lp=o.querySelector('#pLop').value.trim();
    if(t.length<4||!/\s/.test(t)){toast('Em hãy nhập đầy đủ họ và tên');return}if(!lp){toast('Em hãy nhập lớp');return}
    S.profile.ten=t;S.profile.lop=lp;save();closeSheet();toast('Đã lưu thông tin');if(typeof then==='function')then();render();};
}
function askSheet(ctx){
  if(!S.profile.ten){profileSheet(()=>askSheet(ctx));return}
  const o=sheet(`<h3>Hỏi giáo viên</h3><div class="chipS" style="margin:4px 0 2px">${esc(ctx||'Câu hỏi chung')}</div>
  <label class="fld"><span>Nội dung câu hỏi</span><textarea id="aTxt" maxlength="1000" placeholder="Em chưa hiểu phần nào? Hãy viết rõ để thầy cô trả lời nhé."></textarea></label>
  <button class="btn am bk" id="aSend">Gửi câu hỏi</button><p class="mut" style="text-align:center;margin:10px 0 0">Trả lời của giáo viên sẽ hiện trong mục “Hỏi thầy cô”.</p>`);
  setTimeout(()=>o.querySelector('#aTxt').focus(),250);
  o.querySelector('#aSend').onclick=()=>{const t=o.querySelector('#aTxt').value.trim();if(t.length<5){toast('Câu hỏi quá ngắn');return}
    const q={uid:uid(),at:Date.now(),ctx:ctx||'Câu hỏi chung',text:t,sent:''};S.myQs.push(q);save();
    if(hasApi())enqueue({action:'hoi',uid:q.uid,key:S.profile.key,ten:S.profile.ten,lop:S.profile.lop,ngucanh:q.ctx,cauhoi:t});
    closeSheet();toast(hasApi()?'Đã gửi câu hỏi cho giáo viên':'Đã lưu câu hỏi trên máy');render(true);};
}
function tocSheet(){const k=+param;const l=lessonOf(k);
  const o=sheet(`<h3>${esc(l.title)}</h3><div style="max-height:60vh;overflow:auto">${l.slides.map((x,i)=>{const s=slideById[x];return `<a class="li2 ${S.seen[x]?'seen':''}" href="#s-${x}" style="${x===k?'background:var(--t0);border-radius:10px':''}"><span class="n">${S.seen[x]?'✓':i+1}</span><span class="tt"><small>${esc(s.kicker||'')}</small>${esc(s.title)}</span></a>`}).join('')}</div>`);
  o.querySelectorAll('a').forEach(a=>a.addEventListener('click',closeSheet));
  const cur=o.querySelector('a[style]');if(cur)cur.scrollIntoView({block:'center'});}
function fzSheet(){const o=sheet(`<h3>Cỡ chữ</h3><div class="seg" style="margin:10px 0 6px">${[[0.92,'Nhỏ'],[1,'Vừa'],[1.12,'Lớn'],[1.25,'Rất lớn']].map(([v,t])=>`<button data-v="${v}" class="${S.fz==v?'on':''}">${t}</button>`).join('')}</div><p class="mut">Áp dụng cho bài học, bài tập và thẻ ghi nhớ.</p>`);
  o.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{S.fz=+b.dataset.v;save();setZoom();o.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));});}
// ---------- render ----------
let lastY={};
function render(soft){
  const sub=parse();const key=route+'-'+param;
  if(soft&&key===lastRoute&&(route==='s'||route==='ex'))return; // don't disturb reading/quiz
  let html='';
  if(route!=='ex'&&route!=='s'&&!soft)window.scrollTo(0,0);
  switch(route){
    case 'lesson':html=vLesson(param);break;
    case 's':html=vSlide(param);break;
    case 'practice':html=vPractice();break;
    case 'ex':html=vEx(param,sub);break;
    case 'cards':html=vCards(param);break;
    case 'ask':html=vAsk();break;
    default:html=vHome();
  }
  const y=window.scrollY;
  $('#app').innerHTML=html;fixImgs($('#app'));
  if(route==='s'){S.chk[param]&&S.chk[param].forEach(i=>{const c=$('#app').querySelectorAll('.m-chk')[i];c&&c.classList.add('on')});}
  if(soft&&key===lastRoute)window.scrollTo(0,y);else if(route==='s'||route==='ex')window.scrollTo(0,0);
  lastRoute=key;
}
document.addEventListener('click',e=>{
  const chk=e.target.closest('.m-chk');if(chk&&route==='s'){chk.classList.toggle('on');const all=[...$('#app').querySelectorAll('.m-chk')];S.chk[param]=all.map((c,i)=>c.classList.contains('on')?i:-1).filter(i=>i>=0);save();return}
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  if(a==='back'){if(route==='s'){go('lesson-'+lessonOf(param).id)}else if(route==='ex'){go('practice')}else if(route==='cards'){go('cards')}else if(route==='lesson'){go('home')}else go('home');}
  else if(a==='profile'){profileSheet(t.dataset.then==='resend'?()=>{if(EX&&EX.done){sendEx(EX.b,EX.done)}render()}:null)}
  else if(a==='fz')fzSheet();
  else if(a==='ask')askSheet(t.dataset.ctx);
  else if(a==='toc')tocSheet();
  else if(a==='refresh'){toast('Đang kiểm tra…');pullTeacher();flush()}
  else if(a==='pick'){if(!EX)return;EX.ans[EX.i]=+t.dataset.o;render(false);const fb=document.querySelector('.fb');if(fb)fb.scrollIntoView({behavior:'smooth',block:'nearest'})}
  else if(a==='exnext'){EX.i++;if(EX.i>=QZ[EX.b].length){finishEx();go('ex-'+EX.b+'-kq')}else render()}
  else if(a==='exagain'){exStart(EX.b);go('ex-'+EX.b)}
  else if(a==='resend'){if(EX&&EX.done){sendEx(EX.b,EX.done);render()}}
  else if(a==='flip'){FC.flip=!FC.flip;t.classList.toggle('flip')}
  else if(a==='fcnext'){const dk=CD[FC.d];FC.i=(FC.i+1)%dk.cards.length;FC.flip=false;render()}
  else if(a==='fcprev'){FC.i=Math.max(0,FC.i-1);FC.flip=false;render()}
  else if(a==='fcshuf'){CD[FC.d].cards=shuffle(CD[FC.d].cards);FC.i=0;FC.flip=false;render();toast('Đã trộn thẻ')}
});
// swipe navigation in reader & flashcards
let sx=null,sy=null,st=0,blocked=false;
document.addEventListener('touchstart',e=>{if(document.querySelector('.ov'))return;const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now();blocked=!!e.target.closest('.m-tblw,.nav,.bar,textarea,input')},{passive:true});
document.addEventListener('touchend',e=>{if(sx==null||blocked){sx=null;return}const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;sx=null;
  if(Math.abs(dx)<70||Math.abs(dy)>Math.abs(dx)*0.6||Date.now()-st>700)return;
  if(route==='s'){const l=lessonOf(param);const i=l.slides.indexOf(param);const n=dx<0?l.slides[i+1]:l.slides[i-1];if(n!=null){document.documentElement.style.setProperty('--dir',dx<0?'24px':'-24px');go('s-'+n)}}
  else if(route==='cards'&&param!=null){const dk=CD[FC.d];if(dx<0){FC.i=Math.min(dk.cards.length-1,FC.i+1)}else{FC.i=Math.max(0,FC.i-1)}FC.flip=false;render()}
},{passive:true});
document.addEventListener('keydown',e=>{if(document.querySelector('.ov')){if(e.key==='Escape')closeSheet();return}
  if(route==='s'){const l=lessonOf(param);const i=l.slides.indexOf(param);if(e.key==='ArrowRight'&&l.slides[i+1]!=null)go('s-'+l.slides[i+1]);if(e.key==='ArrowLeft'&&l.slides[i-1]!=null)go('s-'+l.slides[i-1]);}});
render();
if(!S.profile.ten&&!S.askedOnce){S.askedOnce=1;save();setTimeout(()=>profileSheet(),600)}
flush();pullTeacher();
setInterval(()=>{flush()},30000);
})();
</script>
</body>
</html>
