" style=\"font-size:15px;font-weight:800;color:#c0392b\">95 dB</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Máy khoan tường</div><div class=\"m-barline\"><div class=\"m-bar\"><i style=\"width:79%;background:#c0392b\"></i></div><div class=\"m-barv\"></div></div><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c0392b\">110 dB</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Máy cắt kim loại gần tai</div><div class=\"m-barline\"><div class=\"m-bar\"><i style=\"width:92%;background:#c0392b\"></i></div><div class=\"m-barv\"></div></div><div class=\"m-grid2\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#fbe4e1;border:1px solid #c0392b\"><div class=\"t\" style=\"font-size:13.5px;font-weight:800;color:#c0392b\">ẢNH HƯỞNG TỚI SỨC KHỎE</div><div class=\"t\" style=\"font-size:15px\"><b>Đau đầu</b> · <b>ù tai</b> · <b>giảm thính lực</b> · <b>cáu bẳn</b>, khó tập trung, mệt mỏi thần kinh</div></div></div><div class=\"m-cell\"><div class=\"m-box dark\" style=\"background:#0b463f\"><div class=\"t\" style=\"font-size:13.5px;font-weight:800;color:#ffd75e\">CẢNH BÁO</div><div class=\"t\" style=\"font-size:15px;color:#dff2ee\"><b style=\"color:#FFD75E\">Điếc nghề nghiệp chiếm 64,4%</b> tổng số ca bệnh nghề nghiệp ở Việt Nam — và <b>không thể chữa khỏi</b>.</div></div></div></div>"},{"k":60,"kicker":"Bài 2 · Mục 3.3.3","title":"Mối nguy vật lý: Rung động","sub":"","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #c98200\"><div class=\"t th\" style=\"font-size:18px;font-weight:800;color:#c98200\">RUNG ĐỘNG CỤC BỘ</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Truyền qua <b>bàn tay, cánh tay</b> khi cầm máy khoan, máy cắt, máy mài trong thời gian dài.</div><div class=\"t\" style=\"font-size:13.5px;font-weight:800;color:#c98200\">TÁC HẠI</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#C98200\">Gây <b>rối loạn sự lưu thông và tuần hoàn máu cục bộ</b></div><div class=\"li dot\" style=\"--c:#C98200\">Gây <b>tổn thương xương – khớp</b>: đau mỏi, giảm lực nắm bàn tay</div><div class=\"li dot\" style=\"--c:#C98200\">Gây <b>tổn thương cơ</b>, teo cơ bàn tay</div><div class=\"li dot\" style=\"--c:#C98200\">Tê bì, trắng ngón tay (hội chứng ngón tay trắng)</div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #0f6a5f\"><div class=\"t th\" style=\"font-size:18px;font-weight:800;color:#0f6a5f\">RUNG ĐỘNG TOÀN THÂN</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Truyền qua <b>chân, thân người</b> khi đứng/ngồi trên sàn, bệ máy, xe có rung mạnh.</div><div class=\"t\" style=\"font-size:13.5px;font-weight:800;color:#0f6a5f\">TÁC HẠI</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#0F6A5F\">Gây <b>thương tổn đến hoạt động của hệ thần kinh trung ương</b></div><div class=\"li dot\" style=\"--c:#0F6A5F\">Gây <b>tổn thương vùng thắt lưng</b>, đau lưng mạn tính</div><div class=\"li dot\" style=\"--c:#0F6A5F\">Thoát vị đĩa đệm cột sống</div><div class=\"li dot\" style=\"--c:#0F6A5F\"><b>Chóng mặt</b>, buồn nôn, ảnh hưởng thị lực</div></div></div></div></div><div class=\"m-box dark\" style=\"background:#0b463f\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffd75e\">ĐẶC ĐIỂM NGUY HIỂM CỦA RUNG ĐỘNG: TÁC HẠI TÍCH LŨY ÂM THẦM</div><div class=\"m-grid2\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffffff\">Tháng đầu</div><div class=\"t\" style=\"font-size:13.5px;color:#afd3cd\">Chỉ thấy mỏi tay sau ca làm — nghỉ là hết, dễ bỏ qua</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffffff\">Sau 1–2 năm</div><div class=\"t\" style=\"font-size:13.5px;color:#afd3cd\">Tê bì ngón tay buổi sáng, giảm lực nắm, khó siết ốc nhỏ</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffffff\">Sau 5 năm</div><div class=\"t\" style=\"font-size:13.5px;color:#afd3cd\">Đau mỏi thường xuyên, tổn thương xương khớp rõ rệt</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffffff\">Lâu dài</div><div class=\"t\" style=\"font-size:13.5px;color:#afd3cd\">Thoát vị đĩa đệm, giảm khả năng lao động vĩnh viễn</div></div></div></div></div>"},{"k":61,"kicker":"Bài 2 · Mục 3.3.4","title":"Mối nguy vật lý: Nguồn nhiệt","sub":"","html":"<div class=\"m-img\"><img data-asset=\"img-e.jpg\" alt=\"\"></div><div class=\"m-box\" style=\"background:#fbe4e1;border:1px solid #c0392b\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c0392b\">NGUỒN NHIỆT TRONG NGHỀ ĐIỆN LẠNH</div><div class=\"t\" style=\"font-size:15px\">Khi <b>hàn đầu rắc co vào đầu nạp của máy nén tủ lạnh</b>, <b>nhiệt độ ngọn lửa hàn rất lớn</b>. Ngoài ra còn nhiều nguồn nhiệt khác trong quá trình làm việc.</div><div class=\"m-box\" style=\"background:#ffffff\"><div class=\"m-grid2\"><div class=\"m-cell\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#c0392b\">Ngọn lửa hàn</div></div><div class=\"m-cell\"><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Nhiệt độ hàng trăm đến hơn một nghìn độ C</div></div></div></div><div class=\"m-box\" style=\"background:#ffffff\"><div class=\"m-grid2\"><div class=\"m-cell\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#c0392b\">Ống đồng, mối hàn vừa xong</div></div><div class=\"m-cell\"><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Vẫn rất nóng dù không còn đỏ, dễ chạm phải</div></div></div></div><div class=\"m-box\" style=\"background:#ffffff\"><div class=\"m-grid2\"><div class=\"m-cell\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#c0392b\">Đường ống đẩy, đầu máy nén</div></div><div class=\"m-cell\"><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Nhiệt độ cao khi hệ thống đang hoạt động</div></div></div></div><div class=\"m-box\" style=\"background:#ffffff\"><div class=\"m-grid2\"><div class=\"m-cell\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#c0392b\">Làm việc ngoài trời, mái tôn</div></div><div class=\"m-cell\"><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Nắng nóng mùa hè → say nóng, mất nước, kiệt sức</div></div></div></div></div><div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #c0392b\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c0392b\">HẬU QUẢ</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#C0392B\"><b>Bỏng nhiệt</b> khi hàn hoặc chạm vào ống nóng, mối hàn</div><div class=\"li dot\" style=\"--c:#C0392B\"><b>Nguy cơ cháy lan</b> sang vật liệu dễ cháy quanh khu vực hàn</div><div class=\"li dot\" style=\"--c:#C0392B\"><b>Cháy nổ</b> khi tia lửa hàn gặp gas lạnh rò rỉ, đặc biệt gas R600a</div><div class=\"li dot\" style=\"--c:#C0392B\"><b>Say nóng, mất nước, kiệt sức</b> khi làm việc lâu dưới nắng, trên mái tôn</div></div></div></div><div class=\"m-cell\"><div class=\"m-box dark\" style=\"background:#0b463f\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffd75e\">CHUỖI SỰ CỐ NGUY HIỂM NHẤT</div><div class=\"t\" style=\"font-size:13.5px;color:#dff2ee\"><div class=\"li num\" style=\"--c:#F5B301\"><span class=\"nb\">1</span><span class=\"nbt\">Hệ thống <b>còn sót gas</b> chưa thu hồi hết</span></div><div class=\"li num\" style=\"--c:#F5B301\"><span class=\"nb\">2</span><span class=\"nbt\">Thợ <b>bắt đầu hàn</b> mối nối trên đường ống</span></div><div class=\"li num\" style=\"--c:#F5B301\"><span class=\"nb\">3</span><span class=\"nbt\">Gas gặp nhiệt → <b>bắt lửa hoặc sinh khí Fosgen cực độc</b></span></div><div class=\"li num\" style=\"--c:#F5B301\"><span class=\"nb\">4</span><span class=\"nbt\"><b>Cháy nổ</b> — bỏng nặng, thiệt hại tài sản</span></div></div></div></div></div>"},{"k":62,"kicker":"Bài 2 · Mục 3.4","title":"Mối nguy Éc-gô-nô-mi trong nghề điện lạnh","sub":"","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #118577\"><div class=\"t th\" style=\"font-size:16px;font-weight:800;color:#118577\">3.4.1. Tư thế và vị trí làm việc bất lợi</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Tư thế làm việc <b>gò bó trong thời gian dài</b>:</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#3FB5A3\"><b>Ngồi xổm</b> — sửa dàn nóng đặt sát đất, tủ lạnh, tủ đông</div><div class=\"li dot\" style=\"--c:#3FB5A3\"><b>Ngửa người</b> — lắp, vệ sinh dàn lạnh treo cao trên tường</div><div class=\"li dot\" style=\"--c:#3FB5A3\"><b>Vặn người</b> — với tay vào khoảng hẹp phía sau máy</div><div class=\"li dot\" style=\"--c:#3FB5A3\"><b>Treo người trên cao</b> — lắp dàn nóng ngoài ban công</div><div class=\"li dot\" style=\"--c:#3FB5A3\">Cúi, dướn, với quá tầm; làm trong <b>không gian chật hẹp</b> như gầm trần</div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #c98200\"><div class=\"t th\" style=\"font-size:16px;font-weight:800;color:#c98200\">3.4.2. Nâng, vận chuyển máy móc, thiết bị nặng</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#C98200\">Nâng, mang <b>cục nóng, cục lạnh, máy nén</b> lên cao, lên thang</div><div class=\"li dot\" style=\"--c:#C98200\">Vận chuyển <b>bình gas, tủ lạnh, tủ đông</b> qua cầu thang hẹp</div><div class=\"li dot\" style=\"--c:#C98200\">Nâng vật nặng <b>sai tư thế</b>: cong lưng, vặn người khi nâng</div><div class=\"li dot\" style=\"--c:#C98200\"><b>Nâng một mình</b> vật vượt quá sức, không dùng xe đẩy</div><div class=\"li dot\" style=\"--c:#C98200\">Với lao động chưa thành niên: <b>pháp luật cấm</b> mang vác vật nặng vượt quá thể trạng</div></div></div></div></div><div class=\"m-box dark\" style=\"background:#0b463f\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffd75e\">HẬU QUẢ TÍCH LŨY TỚI HỆ CƠ – XƯƠNG – KHỚP</div><div class=\"m-grid2\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffffff\">Viêm gân, viêm bao khớp</div><div class=\"t\" style=\"font-size:13.5px;color:#afd3cd\">Vai, khuỷu tay, cổ tay do thao tác lặp lại và giữ tư thế lâu</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffffff\">Đau mỏi cổ, vai, lưng</div><div class=\"t\" style=\"font-size:13.5px;color:#afd3cd\">Xuất hiện sớm, dai dẳng, dễ bị xem là “chuyện bình thường”</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffffff\">Thoát vị đĩa đệm</div><div class=\"t\" style=\"font-size:13.5px;color:#afd3cd\">Do nâng vật nặng sai tư thế, cong lưng, vặn người khi nâng</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffffff\">Giảm lực nắm bàn tay</div><div class=\"t\" style=\"font-size:13.5px;color:#afd3cd\">Khó thao tác chính xác, tăng nguy cơ rơi dụng cụ, gây tai nạn</div></div></div></div></div>"},{"k":63,"kicker":"Bài 2 · Mục 3.5","title":"Mối nguy tâm lý trong nghề điện lạnh","sub":"Mối nguy vô hình nhưng là nguyên nhân gián tiếp của rất nhiều vụ tai nạn","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #7d3c98\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#7d3c98\">Áp lực tiến độ</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Mùa nóng cao điểm, nhiều đơn hàng dồn dập, phải làm nhiều máy trong một ngày</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #c98200\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#c98200\">Áp lực doanh thu</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Thu nhập phụ thuộc số máy sửa được → làm nhanh, bỏ bớt bước an toàn</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #c0392b\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#c0392b\">Sức ép từ khách hàng</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Khách đứng chờ, giục nhanh, đòi hỏi khắt khe, phàn nàn</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #0f6a5f\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#0f6a5f\">Làm việc quá giờ</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Làm liên tục không nghỉ, thiếu ngủ → phản xạ chậm, phán đoán kém</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #118577\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#118577\">Thiếu kinh nghiệm</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Lo lắng, căng thẳng khi gặp sự cố lạ mà không dám hỏi</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #7d3c98\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#7d3c98\">Quan hệ nơi làm việc</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Bị la mắng, đối xử không công bằng, không được lắng nghe</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#f4ecf7;border:1px solid #7d3c98\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#7d3c98\">BIỂU HIỆN TRÊN NGƯỜI LAO ĐỘNG</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#7D3C98\"><b>Căng thẳng thần kinh tâm lí</b>, luôn trong trạng thái gấp gáp</div><div class=\"li dot\" style=\"--c:#7D3C98\"><b>Bị ức chế</b>, dễ nổi nóng, cáu bẳn với đồng nghiệp và khách</div><div class=\"li dot\" style=\"--c:#7D3C98\"><b>Trầm cảm</b>, mất hứng thú với công việc</div><div class=\"li dot\" style=\"--c:#7D3C98\">Mệt mỏi kéo dài, mất ngủ, ăn không ngon</div><div class=\"li dot\" style=\"--c:#7D3C98\"><b>Mất tập trung</b> khi đang thao tác</div></div></div></div><div class=\"m-cell\"><div class=\"m-box dark\" style=\"background:#0b463f\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffd75e\">VÌ SAO ĐÂY LÀ MỐI NGUY THẬT SỰ?</div><div class=\"t\" style=\"font-size:15px;color:#dff2ee\">Mối nguy tâm lý <b style=\"color:#FFD75E\">không trực tiếp gây thương tích</b>, nhưng nó tạo ra chuỗi:</div><div class=\"t\" style=\"font-size:13.5px;color:#dff2ee\"><div class=\"li num\" style=\"--c:#F5B301\"><span class=\"nb\">1</span><span class=\"nbt\">Căng thẳng, mệt mỏi, gấp gáp</span></div><div class=\"li num\" style=\"--c:#F5B301\"><span class=\"nb\">2</span><span class=\"nbt\"><b>Bỏ bớt bước an toàn</b> để làm cho nhanh</span></div><div class=\"li num\" style=\"--c:#F5B301\"><span class=\"nb\">3</span><span class=\"nbt\"><b>Mất tập trung → thao tác sai</b></span></div><div class=\"li num\" style=\"--c:#F5B301\"><span class=\"nb\">4</span><span class=\"nbt\"><b>Tai nạn lao động xảy ra</b></span></div></div></div></div></div>"},{"k":64,"kicker":"Bài 2 · Mục 4","title":"Tổng kết Bài 2","sub":"Bản đồ mối nguy nghề điện lạnh — hãy nhớ để nhận diện mỗi ngày","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #118577\"><div class=\"m-irow\"><span class=\"m-num\" style=\"color:#118577\">01</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#08312e\">Mối nguy = bất cứ thứ gì có tiềm năng gây hại</div></div></div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Định nghĩa ILO; tương ứng “yếu tố nguy hiểm, yếu tố có hại” trong Luật ATVSLĐ 2015.</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #0f6a5f\"><div class=\"m-irow\"><span class=\"m-num\" style=\"color:#0f6a5f\">02</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#08312e\">6 nhóm mối nguy</div></div></div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Vật lý · An toàn · Hóa chất · Sinh học · Éc-gô-nô-mi · Tâm lý.</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #c98200\"><div class=\"m-irow\"><span class=\"m-num\" style=\"color:#c98200\">03</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#08312e\">4 cách xác định mối nguy</div></div></div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Quan sát &amp; kiểm tra · Trao đổi đồng nghiệp · Tra hồ sơ báo cáo · Tự đặt câu hỏi.</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #c98200\"><div class=\"m-irow\"><span class=\"m-num\" style=\"color:#c98200\">04</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#08312e\">Hóa chất: gas lạnh, dầu, sơn, khói hàn</div></div></div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Gas xâm nhập chủ yếu qua hô hấp; gây ngạt, ngộ độc, bỏng lạnh 3 cấp độ; R600a dễ cháy nổ.</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #c0392b\"><div class=\"m-irow\"><span class=\"m-num\" style=\"color:#c0392b\">05</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#08312e\">An toàn: điện, vật sắc nhọn, trên cao</div></div></div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Chỉ 20–25 mA đã khó rời vật mang điện; 90–100 mA có thể ngừng tim sau 3 giây.</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #0f6a5f\"><div class=\"m-irow\"><span class=\"m-num\" style=\"color:#0f6a5f\">06</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#08312e\">Vật lý: bụi, ồn, rung, nhiệt</div></div></div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Ngưỡng ồn 85 dB/8 giờ; điếc nghề nghiệp chiếm 64,4% ca BNN; bụi phổi silic 10,2%.</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #118577\"><div class=\"m-irow\"><span class=\"m-num\" style=\"color:#118577\">07</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#08312e\">Éc-gô-nô-mi: tư thế và mang vác</div></div></div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Ngồi xổm, ngửa người, vặn người, treo người; nâng vật nặng sai tư thế gây thoát vị đĩa đệm.</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #7d3c98\"><div class=\"m-irow\"><span class=\"m-num\" style=\"color:#7d3c98\">08</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#08312e\">Tâm lý: áp lực tiến độ, doanh thu</div></div></div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Gây căng thẳng → mất tập trung → thao tác sai → tai nạn.</div></div></div></div><div class=\"m-box dark\" style=\"background:#0b463f\"><div class=\"t\" style=\"font-size:16px;color:#dff2ee\">Tiếp theo: <b style=\"color:#FFD75E\">8 câu hỏi trắc nghiệm Bài 2</b> — kiểm tra khả năng nhận diện mối nguy của em.</div></div>"},{"k":74,"kicker":"Bài 3","title":"Mục tiêu bài học","sub":"Sau khi học xong bài này, học sinh có khả năng:","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#118577\">KIẾN THỨC &amp; KĨ NĂNG</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li num\" style=\"--c:#118577\"><span class=\"nb\">1</span><span class=\"nbt\">Trình bày và áp dụng được <b>nguyên tắc phòng ngừa, kiểm soát mối nguy</b> và các biện pháp làm việc đảm bảo ATVSLĐ;</span></div><div class=\"li num\" style=\"--c:#118577\"><span class=\"nb\">2</span><span class=\"nbt\">Nhận biết được <b>biển báo ATVSLĐ</b> và sử dụng đúng <b>phương tiện bảo vệ cá nhân</b>;</span></div><div class=\"li num\" style=\"--c:#118577\"><span class=\"nb\">3</span><span class=\"nbt\"><b>Ứng phó, xử lí</b> được một số tình huống, sự cố thường gặp tại nơi làm việc.</span></div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#edf8f6\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#118577\">THÁI ĐỘ</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#3FB5A3\">Chủ động phòng ngừa, không chờ tai nạn xảy ra mới xử lý</div><div class=\"li dot\" style=\"--c:#3FB5A3\">Tuân thủ quy tắc ATVSLĐ tại nơi làm việc</div><div class=\"li dot\" style=\"--c:#3FB5A3\">Bình tĩnh, đúng quy trình khi xử lý sự cố</div></div></div></div></div><div class=\"m-box dark\" style=\"background:#0b463f\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffd75e\">CẤU TRÚC BÀI 3 — TỪ PHÒNG NGỪA ĐẾN ỨNG PHÓ</div><div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:#FFD75E;color:#08312E;\">1</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffffff\">NGUYÊN TẮC</div></div></div><div class=\"t\" style=\"font-size:15px;color:#afd3cd\">Tháp 5 tầng kiểm soát mối nguy: loại bỏ → thay thế → kĩ thuật → hành chính → PTBVCN</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:#FFD75E;color:#08312E;\">2</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffffff\">BIỆN PHÁP CỤ THỂ</div></div></div><div class=\"t\" style=\"font-size:15px;color:#afd3cd\">Kiểm soát từng nhóm mối nguy: hóa chất, an toàn, vật lý, éc-gô-nô-mi, tâm lý + biển báo + PTBVCN</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:#FFD75E;color:#08312E;\">3</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffffff\">ỨNG PHÓ SỰ CỐ</div></div></div><div class=\"t\" style=\"font-size:15px;color:#afd3cd\">Xử lý chấn thương, sơ cứu tai nạn điện, thoát hiểm đám cháy và sử dụng bình chữa cháy</div></div></div></div></div>"},{"k":75,"kicker":"Bài 3 · Mục 1","title":"Tháp nguyên tắc kiểm soát mối nguy","sub":"Thứ tự ưu tiên: luôn bắt đầu từ trên xuống. PTBVCN là biện pháp CUỐI CÙNG, không phải đầu tiên.","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-pill\">HIỆU QUẢ CAO ↓ HIỆU QUẢ THẤP</div></div><div class=\"m-cell\"><div class=\"m-box dark\" style=\"background:#1e8449\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:rgba(255,255,255,.22);color:#fff;\">1</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:16px;font-weight:800;color:#ffffff\">LOẠI BỎ</div><div class=\"t\" style=\"font-size:13.5px;color:rgba(255,255,255,0.88)\">Loại bỏ mối nguy ngay tại nguồn phát sinh</div></div></div></div><div class=\"m-box\" style=\"background:#27ae60\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:rgba(255,255,255,.22);color:#fff;\">2</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:16px;font-weight:800;color:#ffffff\">THAY THẾ</div><div class=\"t\" style=\"font-size:13.5px;color:rgba(255,255,255,0.88)\">Thay nguyên, nhiên liệu, hóa chất độc hại bằng loại ít gây hại hơn</div></div></div></div><div class=\"m-box dark\" style=\"background:#118577\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:rgba(255,255,255,.22);color:#fff;\">3</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:16px;font-weight:800;color:#ffffff\">BIỆN PHÁP KĨ THUẬT</div><div class=\"t\" style=\"font-size:13.5px;color:rgba(255,255,255,0.88)\">Cách ly, che chắn, cơ cấu an toàn, khóa liên động, hút khí cục bộ</div></div></div></div><div class=\"m-box\" style=\"background:#c98200\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:rgba(255,255,255,.22);color:#fff;\">4</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:16px;font-weight:800;color:#ffffff\">BIỆN PHÁP HÀNH CHÍNH</div><div class=\"t\" style=\"font-size:13.5px;color:rgba(255,255,255,0.88)\">Tuyển chọn, huấn luyện, nội quy, quy trình, luân phiên, chế tài</div></div></div></div><div class=\"m-box dark\" style=\"background:#c0392b\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:rgba(255,255,255,.22);color:#fff;\">5</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:16px;font-weight:800;color:#ffffff\">PTBVCN</div><div class=\"t\" style=\"font-size:13.5px;color:rgba(255,255,255,0.88)\">Bảo vệ các bộ phận cơ thể — biện pháp bổ sung cuối cùng</div></div></div></div></div></div><div class=\"m-box\" style=\"background:#fff6de;border-left:5px solid #c98200\"><div class=\"t\" style=\"font-size:15px;color:#c98200\"><b>Sai lầm phổ biến:</b> chỉ phát khẩu trang, găng tay rồi coi là “đã làm an toàn”. PTBVCN chỉ là <b>biện pháp bảo vệ bổ sung</b> — phải làm 4 tầng trên trước.</div></div>"},{"k":76,"kicker":"Bài 3 · Mục 1.1","title":"Tầng 1 – 2: Loại bỏ hoặc Thay thế","sub":"","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#e4f4e9;border:1px solid #1e8449\"><div class=\"t th\" style=\"font-size:21px;font-weight:800;color:#1e8449\">a) LOẠI BỎ</div><div class=\"t\" style=\"font-size:15px\">Là biện pháp phòng ngừa <b>hữu hiệu nhất</b> nhằm loại bỏ các mối nguy <b>ngay tại nguồn phát sinh</b> chúng.</div><div class=\"t\" style=\"font-size:13.5px;font-weight:800;color:#1e8449\">VÍ DỤ TRONG NGHỀ ĐIỆN LẠNH</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#1E8449\"><b>Thu hồi hết gas</b> trước khi hàn → loại bỏ hoàn toàn nguy cơ cháy nổ và khí Fosgen</div><div class=\"li dot\" style=\"--c:#1E8449\"><b>Ngắt aptomat, treo biển cảnh báo</b> → loại bỏ nguy cơ điện giật</div><div class=\"li dot\" style=\"--c:#1E8449\">Đưa máy nén <b>xuống mặt đất để sửa</b> thay vì sửa trên mái → loại bỏ nguy cơ ngã cao</div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#edf8f6;border:1px solid #118577\"><div class=\"t th\" style=\"font-size:21px;font-weight:800;color:#118577\">b) THAY THẾ</div><div class=\"t\" style=\"font-size:15px\">Là biện pháp nhằm <b>thay thế các loại nguyên, nhiên liệu, hóa chất độc hại</b> bởi các loại <b>ít gây hại hơn</b>.</div><div class=\"t\" style=\"font-size:13.5px;font-weight:800;color:#118577\">VÍ DỤ TRONG NGHỀ ĐIỆN LẠNH</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#118577\">Thay gas <b>R12 độc, phá hủy tầng Ozon</b> bằng loại gas thân thiện hơn</div><div class=\"li dot\" style=\"--c:#118577\">Ưu tiên sử dụng <b>loại gas ít độc hại</b> khi có nhiều lựa chọn</div><div class=\"li dot\" style=\"--c:#118577\">Thay <b>thang gỗ cũ</b> bằng <b>thang nhôm có nấc chống trượt</b>, giàn giáo đạt chuẩn</div></div></div></div></div><div class=\"m-box dark\" style=\"background:#0b463f\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffd75e\">VÌ SAO HAI TẦNG NÀY HIỆU QUẢ NHẤT?</div><div class=\"m-grid2\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffffff\">Không phụ thuộc con người</div><div class=\"t\" style=\"font-size:13.5px;color:#afd3cd\">Mối nguy đã bị loại bỏ thì không ai có thể “quên” hay “làm tắt” được</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffffff\">Bảo vệ tất cả mọi người</div><div class=\"t\" style=\"font-size:13.5px;color:#afd3cd\">Không chỉ người thợ mà cả đồng nghiệp, khách hàng, người xung quanh</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffffff\">Hiệu quả vĩnh viễn</div><div class=\"t\" style=\"font-size:13.5px;color:#afd3cd\">Không cần nhắc nhở, kiểm tra, bảo dưỡng như các biện pháp khác</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffffff\">Chi phí thấp về lâu dài</div><div class=\"t\" style=\"font-size:13.5px;color:#afd3cd\">Rẻ hơn nhiều so với chi phí một vụ tai nạn hoặc mua PTBVCN liên tục</div></div></div></div></div>"},{"k":77,"kicker":"Bài 3 · Mục 1.2","title":"Tầng 3 – 4: Biện pháp kĩ thuật và hành chính","sub":"","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #118577\"><div class=\"t th\" style=\"font-size:18px;font-weight:800;color:#118577\">a) BIỆN PHÁP KĨ THUẬT</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Là biện pháp phòng ngừa thông qua <b>áp dụng các biện pháp kĩ thuật, công nghệ</b> để ngăn cách người lao động với mối nguy.</div><div class=\"t\" style=\"font-size:13.5px;font-weight:800;color:#118577\">CÁC DẠNG THƯỜNG GẶP</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#3FB5A3\"><b>Cách ly, che chắn</b>: lưới bảo vệ quạt dàn nóng, hộp che tủ điện</div><div class=\"li dot\" style=\"--c:#3FB5A3\"><b>Cơ cấu an toàn</b>: aptomat chống giật (ELCB/RCD), van an toàn, rơ le áp suất</div><div class=\"li dot\" style=\"--c:#3FB5A3\"><b>Khóa liên động</b>: máy tự ngắt khi mở nắp bảo vệ</div><div class=\"li dot\" style=\"--c:#3FB5A3\"><b>Nối đất, nối không</b> cho vỏ thiết bị điện</div><div class=\"li dot\" style=\"--c:#3FB5A3\"><b>Hút khí cục bộ</b>, thông gió khu vực hàn, sơn; thiết bị dò gas</div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #c98200\"><div class=\"t th\" style=\"font-size:18px;font-weight:800;color:#c98200\">b) BIỆN PHÁP HÀNH CHÍNH</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Là sử dụng các biện pháp nhằm giúp người lao động <b>hạn chế tiếp xúc với mối nguy</b> thông qua tổ chức, quản lý công việc.</div><div class=\"t\" style=\"font-size:13.5px;font-weight:800;color:#c98200\">CÁC DẠNG THƯỜNG GẶP</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#C98200\"><b>Tuyển chọn</b> lao động phù hợp sức khỏe, độ tuổi, tay nghề</div><div class=\"li dot\" style=\"--c:#C98200\"><b>Huấn luyện ATVSLĐ</b> trước khi nhận việc và định kỳ</div><div class=\"li dot\" style=\"--c:#C98200\"><b>Hướng dẫn nội quy, quy trình</b> làm việc an toàn</div><div class=\"li dot\" style=\"--c:#C98200\"><b>Luân phiên công việc</b>, bố trí nghỉ giữa ca để giảm tiếp xúc</div><div class=\"li dot\" style=\"--c:#C98200\"><b>Biển báo, cảnh báo</b> và <b>chế tài</b> khi vi phạm</div></div></div></div></div><div class=\"m-box\" style=\"background:#edf8f6;border:1px solid #3fb5a3\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#118577\">ÁP DỤNG CHO MỘT CÔNG VIỆC CỤ THỂ: HÀN ỐNG ĐỒNG TRÊN MÁI NHÀ</div><div class=\"m-grid2\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border-top:5px solid #1e8449\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#1e8449\">Loại bỏ</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Thu hồi hết gas trước khi hàn</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border-top:5px solid #27ae60\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#27ae60\">Thay thế</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Dùng thang nhôm chuẩn thay thang gỗ cũ</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border-top:5px solid #118577\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#118577\">Kĩ thuật</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Tấm chắn chống cháy lan, bình chữa cháy sẵn sàng</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border-top:5px solid #c98200\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c98200\">Hành chính</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Làm nhóm 2 người, huấn luyện trước, có biển cảnh báo</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border-top:5px solid #c0392b\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c0392b\">PTBVCN</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Kính hàn, găng tay da, đai an toàn, giày bảo hộ</div></div></div></div></div>"},{"k":78,"kicker":"Bài 3 · Mục 1.3","title":"Tầng 5: Sử dụng phương tiện bảo vệ cá nhân","sub":"","html":"<div class=\"m-box dark\" style=\"background:#0b463f\"><div class=\"t\" style=\"font-size:16px;color:#dff2ee\">Sử dụng PTBVCN là biện pháp nhằm <b style=\"color:#FFD75E\">bảo vệ các bộ phận cơ thể NLĐ trước các mối nguy</b>. Tuy nhiên, đây chỉ là <b style=\"color:#FFD75E\">biện pháp bảo vệ bổ sung</b> — không thay thế được các biện pháp ở 4 tầng trên.</div></div><div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-img\"><img data-asset=\"img-g.jpg\" alt=\"\"></div><div class=\"m-img\"><img data-asset=\"img-f.jpg\" alt=\"\"></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#fbe4e1;border:1px solid #c0392b\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c0392b\">4 NGUYÊN TẮC BẮT BUỘC KHI DÙNG PTBVCN</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\"><div class=\"li num\" style=\"--c:#C0392B\"><span class=\"nb\">1</span><span class=\"nbt\"><b>Đúng loại</b> — khẩu trang lọc độc khi nạp gas, không dùng khẩu trang y tế; găng tay cách điện khi làm điện, không dùng găng vải</span></div><div class=\"li num\" style=\"--c:#C0392B\"><span class=\"nb\">2</span><span class=\"nbt\"><b>Đủ bộ</b> — dùng tất cả PTBVCN mà công việc yêu cầu, không dùng một nửa</span></div><div class=\"li num\" style=\"--c:#C0392B\"><span class=\"nb\">3</span><span class=\"nbt\"><b>Đúng cách</b> — đội, đeo, cài, thắt đúng kỹ thuật thì mới có tác dụng bảo vệ</span></div><div class=\"li num\" style=\"--c:#C0392B\"><span class=\"nb\">4</span><span class=\"nbt\"><b>Bảo quản tốt</b> — kiểm tra trước khi dùng, vệ sinh sau khi dùng, thay khi hỏng</span></div></div></div></div></div><div class=\"m-box\" style=\"background:#fff6de;border-left:5px solid #c98200\"><div class=\"t\" style=\"font-size:15px;color:#c98200\"><b>Nhớ rằng:</b> PTBVCN <b>không loại bỏ mối nguy</b> — nó chỉ dựng một hàng rào mỏng giữa em và mối nguy. Hàng rào đó có thể hỏng, có thể dùng sai. Vì vậy 4 tầng trên vẫn phải làm trước.</div></div>"},{"k":79,"kicker":"Bài 3 · Mục 2.1.1","title":"Biện pháp kiểm soát mối nguy: Môi chất lạnh","sub":"","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #c98200\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c98200\">8 BIỆN PHÁP BẮT BUỘC</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#C98200\"><b>Lựa chọn và sử dụng đúng loại</b> môi chất lạnh/gas lạnh cần thiết. <b>Ưu tiên loại gas ít độc hại</b></div><div class=\"li dot\" style=\"--c:#C98200\"><b>Tuân thủ qui trình, thao tác</b> làm việc ATVSLĐ</div><div class=\"li dot\" style=\"--c:#C98200\">Luôn đặt <b>bình gas ở nơi khô thoáng, sạch sẽ</b></div><div class=\"li dot\" style=\"--c:#C98200\"><b>Lắp đặt thiết bị phát hiện dò gas lạnh</b>, thiết bị giám sát nồng độ ô xy; sử dụng <b>thiết bị thu hồi gas</b></div><div class=\"li dot\" style=\"--c:#C98200\">Vị trí làm việc đúng: <b>đứng đầu hướng gió</b> khi làm việc, tránh hít phải môi chất lạnh bị rò, hở</div><div class=\"li dot\" style=\"--c:#C98200\"><b>Thực hiện qui tắc ATVSLĐ</b> khi làm việc</div><div class=\"li dot\" style=\"--c:#C98200\">Sử dụng đúng và đủ PTBVCN: <b>kính, găng tay, khẩu trang lọc độc</b></div></div></div></div><div class=\"m-cell\"><div class=\"m-box dark\" style=\"background:#0b463f\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffd75e\">ÁNH XẠ THEO THÁP KIỂM SOÁT</div><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#1e8449\">Loại bỏ</div><div class=\"t\" style=\"font-size:13.5px;color:#dff2ee\">Thu hồi hết gas trước khi hàn</div></div><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#52be80\">Thay thế</div><div class=\"t\" style=\"font-size:13.5px;color:#dff2ee\">Chọn gas ít độc hại hơn</div></div><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#3fb5a3\">Kĩ thuật</div><div class=\"t\" style=\"font-size:13.5px;color:#dff2ee\">Thiết bị dò gas, giám sát ôxy, thu hồi gas</div></div><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffd75e\">Hành chính</div><div class=\"t\" style=\"font-size:13.5px;color:#dff2ee\">Quy trình nạp gas, đứng đầu hướng gió</div></div><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ec7063\">PTBVCN</div><div class=\"t\" style=\"font-size:13.5px;color:#dff2ee\">Kính, găng tay, khẩu trang lọc độc</div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#fbe4e1;border:1px solid #c0392b\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c0392b\">KHI BỊ BỎNG LẠNH DO GAS — XỬ LÝ NGAY</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\"><div class=\"li num\" style=\"--c:#C0392B\"><span class=\"nb\">1</span><span class=\"nbt\"><b>Nhanh chóng tháo cởi áo, quần bị dính gas lạnh</b></span></div><div class=\"li num\" style=\"--c:#C0392B\"><span class=\"nb\">2</span><span class=\"nbt\"><b>Ủ ấm</b> vùng tổn thương hoặc dùng <b>nước sạch, ấm</b> để sơ cứu chỗ tổn thương</span></div><div class=\"li num\" style=\"--c:#C0392B\"><span class=\"nb\">3</span><span class=\"nbt\"><b>Nhanh chóng đưa tới cơ sở y tế</b></span></div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#fff6de;border:1px solid #c98200\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c98200\">TUYỆT ĐỐI KHÔNG</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#C98200\"><b>Không</b> hàn, không bật/tắt thiết bị điện ở khu vực nghi rò gas</div><div class=\"li dot\" style=\"--c:#C98200\"><b>Không</b> làm việc với gas trong không gian kín, thiếu thông gió</div><div class=\"li dot\" style=\"--c:#C98200\"><b>Không</b> để bình gas gần nguồn nhiệt, ngọn lửa, nơi nắng nóng</div><div class=\"li dot\" style=\"--c:#C98200\"><b>Không</b> dùng nước nóng/lửa hơ trực tiếp lên vùng bỏng lạnh</div></div></div></div></div>"},{"k":80,"kicker":"Bài 3 · Mục 2.1.2 – 2.1.3","title":"Biện pháp kiểm soát: Dầu bôi trơn và Sơn cách điện","sub":"","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #c98200\"><div class=\"t th\" style=\"font-size:18px;font-weight:800;color:#c98200\">DẦU BÔI TRƠN</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#C98200\"><b>Nắm rõ các thông tin cơ bản</b> về loại dầu bôi trơn sử dụng</div><div class=\"li dot\" style=\"--c:#C98200\"><b>Nắm chắc qui trình thay dầu</b> và thải bỏ dầu thải</div><div class=\"li dot\" style=\"--c:#C98200\">Nên <b>đóng chặt nắp đậy</b> sau khi sử dụng xong dầu</div><div class=\"li dot\" style=\"--c:#C98200\"><b>Bảo quản riêng biệt</b>, có <b>đầy đủ tem nhãn</b></div><div class=\"li dot\" style=\"--c:#C98200\"><b>Không ăn uống tại nơi làm việc</b></div><div class=\"li dot\" style=\"--c:#C98200\"><b>Thực hiện qui tắc ATVSLĐ</b> khi làm việc</div><div class=\"li dot\" style=\"--c:#C98200\">Sử dụng đủ và đúng PTBVCN: <b>găng tay, kính bảo vệ</b></div></div><div class=\"m-box\" style=\"background:#fff6de\"><div class=\"t\" style=\"font-size:13.5px;font-weight:800;color:#c98200\">VÌ SAO KHÔNG ĂN UỐNG TẠI NƠI LÀM VIỆC?</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Dầu, gas, hóa chất bám trên tay sẽ theo thức ăn, nước uống <b>vào đường tiêu hóa</b> — đây là con đường nhiễm độc bị xem nhẹ nhất. Luôn rửa tay bằng xà phòng trước khi ăn.</div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #7d3c98\"><div class=\"t th\" style=\"font-size:18px;font-weight:800;color:#7d3c98\">SƠN CÁCH ĐIỆN</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#7D3C98\">Nắm rõ <b>thông tin, hướng dẫn sử dụng</b> loại sơn cách điện dùng</div><div class=\"li dot\" style=\"--c:#7D3C98\">Chỉ sơn ở <b>nơi thông thoáng</b> hoặc có <b>hút khí cục bộ</b></div><div class=\"li dot\" style=\"--c:#7D3C98\"><b>Đứng đầu hướng gió</b>, tránh hít trực tiếp hơi dung môi</div><div class=\"li dot\" style=\"--c:#7D3C98\"><b>Đóng kín nắp</b>, bảo quản riêng biệt, tránh xa nguồn nhiệt và lửa</div><div class=\"li dot\" style=\"--c:#7D3C98\"><b>Không ăn uống, không hút thuốc</b> khi đang làm việc với sơn</div><div class=\"li dot\" style=\"--c:#7D3C98\">Rút ngắn thời gian tiếp xúc, <b>nghỉ giữa quãng</b> ở nơi thoáng khí</div><div class=\"li dot\" style=\"--c:#7D3C98\">PTBVCN: <b>khẩu trang lọc độc, kính, găng tay</b></div></div><div class=\"m-box\" style=\"background:#f4ecf7\"><div class=\"t\" style=\"font-size:13.5px;font-weight:800;color:#7d3c98\">THU GOM CHẤT THẢI ĐÚNG QUY ĐỊNH</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Dầu thải, vỏ hộp sơn, giẻ lau dính hóa chất đều là <b>chất thải nguy hại</b>. Phải thu gom vào thùng có nắp, dán nhãn, giao cho đơn vị xử lý — không đổ ra cống, không đốt.</div></div></div></div></div>"},{"k":81,"kicker":"Bài 3 · Mục 2.1.4 & 2.3","title":"Biện pháp kiểm soát: Khói hàn và Nguồn nhiệt","sub":"","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #c0392b\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c0392b\">BIỆN PHÁP KHI HÀN</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#C0392B\"><b>Thu hồi hết gas</b> trong hệ thống <b>trước khi hàn</b> — tránh cháy nổ và khí Fosgen</div><div class=\"li dot\" style=\"--c:#C0392B\"><b>Kiểm tra bình khí</b>, van, đồng hồ, dây dẫn khí <b>trước khi hàn</b></div><div class=\"li dot\" style=\"--c:#C0392B\"><b>Không vắt dây dẫn khí trên vai</b> khi làm việc</div><div class=\"li dot\" style=\"--c:#C0392B\"><b>Che chắn khu vực hàn</b>, dọn sạch vật liệu dễ cháy trong bán kính an toàn</div><div class=\"li dot\" style=\"--c:#C0392B\">Hàn ở <b>nơi thông thoáng</b> hoặc có <b>hút khói cục bộ</b>; đứng đầu hướng gió</div><div class=\"li dot\" style=\"--c:#C0392B\"><b>Chuẩn bị bình chữa cháy</b> sẵn sàng tại khu vực hàn</div><div class=\"li dot\" style=\"--c:#C0392B\">Sau khi hàn: <b>kiểm tra lại khu vực</b>, đảm bảo không còn tàn lửa âm ỉ</div><div class=\"li dot\" style=\"--c:#C0392B\">PTBVCN: <b>kính hàn/mặt nạ hàn, găng tay da, quần áo khó cháy, khẩu trang</b></div></div></div></div><div class=\"m-cell\"><div class=\"m-box dark\" style=\"background:#0b463f\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffd75e\">KIỂM SOÁT NGUỒN NHIỆT KHÁC</div><div class=\"t\" style=\"font-size:13.5px;color:#dff2ee\"><div class=\"li dot\" style=\"--c:#F5B301\"><b>Che chắn nguồn nhiệt</b>, đường ống nóng bằng vật liệu cách nhiệt</div><div class=\"li dot\" style=\"--c:#F5B301\"><b>Chờ nguội</b> trước khi chạm vào mối hàn, ống đồng vừa hàn</div><div class=\"li dot\" style=\"--c:#F5B301\">Đeo <b>găng tay chịu nhiệt</b> khi phải tiếp xúc phần nóng</div><div class=\"li dot\" style=\"--c:#F5B301\">Làm ngoài trời nắng: <b>che nắng, uống đủ nước</b>, nghỉ giữa quãng ở nơi mát</div><div class=\"li dot\" style=\"--c:#F5B301\">Tránh giờ nắng đỉnh điểm khi làm trên mái tôn</div></div></div></div></div><div class=\"m-box\" style=\"background:#fff6de;border:1px solid #c98200\"><div class=\"t th\" style=\"font-size:15px;font-weig
