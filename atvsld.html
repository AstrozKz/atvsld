động</div></div></div></div></div></div><div class=\"m-box\" style=\"background:#edf8f6;border-left:5px solid #118577\"><div class=\"t\" style=\"font-size:15px;color:#0b463f\"><b>Ghi nhớ:</b> ATLĐ chống <b>yếu tố nguy hiểm</b> → ngăn thương tật, tử vong. VSLĐ chống <b>yếu tố có hại</b> → ngăn bệnh tật, suy giảm sức khỏe.</div></div>"},{"k":8,"kicker":"Bài 1 · Khái niệm 1 – 2","title":"An toàn lao động & Vệ sinh lao động","sub":"","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #118577\"><span class=\"m-badge pill\" style=\"background:#118577;color:#fff;\">ATLĐ</span><div class=\"t th\" style=\"font-size:21px;font-weight:800;color:#08312e;line-height:1.15\">An toàn lao động</div><div class=\"t\" style=\"font-size:16px;color:#4a6a66\">Là giải pháp <b>phòng, chống tác động của các yếu tố nguy hiểm</b> nhằm bảo đảm không xảy ra <b>thương tật, tử vong</b> đối với con người trong quá trình lao động.</div><div class=\"m-box\" style=\"background:#edf8f6\"><div class=\"t\" style=\"font-size:15px;color:#118577\">Ví dụ trong nghề điện lạnh: ngắt nguồn điện trước khi sửa máy nén, dùng thang có 3 điểm tiếp xúc khi lắp dàn nóng.</div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #c98200\"><span class=\"m-badge pill\" style=\"background:#C98200;color:#fff;\">VSLĐ</span><div class=\"t th\" style=\"font-size:21px;font-weight:800;color:#08312e;line-height:1.15\">Vệ sinh lao động</div><div class=\"t\" style=\"font-size:16px;color:#4a6a66\">Là giải pháp <b>phòng, chống tác động của yếu tố có hại</b> gây <b>bệnh tật, làm suy giảm sức khỏe</b> cho con người trong quá trình lao động.</div><div class=\"m-box\" style=\"background:#fff6de\"><div class=\"t\" style=\"font-size:15px;color:#c98200\">Ví dụ trong nghề điện lạnh: đeo khẩu trang lọc độc khi nạp gas, dùng nút tai khi máy chạy ồn.</div></div></div></div></div><div class=\"m-box dark\" style=\"background:#0b463f\"><div class=\"t\" style=\"font-size:15px;color:#cdeae4\">Nguồn: Điều 3, Luật An toàn, vệ sinh lao động số 84/2015/QH13 — hai giải pháp này luôn đi cùng nhau, gọi chung là <b style=\"color:#FFD75E\">ATVSLĐ</b>.</div></div>"},{"k":9,"kicker":"Bài 1 · Khái niệm 3 – 4","title":"Yếu tố nguy hiểm & Yếu tố có hại","sub":"Phân biệt hai khái niệm dễ nhầm lẫn nhất","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#fbe4e1;border:1px solid #c0392b\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c0392b\">YẾU TỐ NGUY HIỂM</div><div class=\"t\" style=\"font-size:16px\">Là yếu tố gây <b>mất an toàn</b>, làm <b>tổn thương hoặc gây tử vong</b> cho con người trong quá trình lao động.</div><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#c0392b\">Trong nghề điện lạnh:</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#C0392B\">Điện giật khi đấu nối máy nén</div><div class=\"li dot\" style=\"--c:#C0392B\">Ngã từ thang khi lắp dàn nóng</div><div class=\"li dot\" style=\"--c:#C0392B\">Nổ bình gas R600a khi gặp lửa hàn</div><div class=\"li dot\" style=\"--c:#C0392B\">Vật sắc nhọn: ba via ống đồng, mũi khoan</div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#fff6de;border:1px solid #c98200\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c98200\">YẾU TỐ CÓ HẠI</div><div class=\"t\" style=\"font-size:16px\">Là yếu tố gây <b>bệnh tật, làm suy giảm sức khỏe</b> con người trong quá trình lao động.</div><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#c98200\">Trong nghề điện lạnh:</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#C98200\">Hơi dầu bôi trơn, hơi sơn cách điện</div><div class=\"li dot\" style=\"--c:#C98200\">Khói hàn khi hàn ống đồng</div><div class=\"li dot\" style=\"--c:#C98200\">Tiếng ồn máy nén, bụi khi khoan tường</div><div class=\"li dot\" style=\"--c:#C98200\">Tư thế ngồi xổm, ngửa người kéo dài</div></div></div></div></div><div class=\"m-box\" style=\"background:#ffffff;border-left:5px solid #118577\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#118577\">CÁCH PHÂN BIỆT NHANH</div><div class=\"t\" style=\"font-size:16px;color:#4a6a66\"><b style=\"color:#C0392B\">Nguy hiểm</b> → gây hại <b>ngay lập tức</b> (chấn thương, tử vong)   |   <b style=\"color:#C98200\">Có hại</b> → gây hại <b>từ từ, tích lũy</b> (bệnh nghề nghiệp sau nhiều năm)</div></div>"},{"k":10,"kicker":"Bài 1 · Khái niệm 5","title":"Mối nguy hiểm (Mối nguy)","sub":"","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box dark\" style=\"background:#0b463f\"><div class=\"t\" style=\"font-size:18px;color:#ffffff\">“Mối nguy là <b style=\"color:#FFD75E\">bất cứ thứ gì có tiềm năng gây hại</b> hoặc có ảnh hưởng tiêu cực đối với sức khỏe của con người — gây chấn thương, ốm đau, bệnh tật, tử vong hoặc các tổn thương khác.”</div><div class=\"t\" style=\"font-size:15px;color:#3fb5a3\">— Định nghĩa của Tổ chức Lao động Quốc tế (ILO)</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#edf8f6;border:1px solid #3fb5a3\"><div class=\"t\" style=\"font-size:13.5px;font-weight:800;color:#118577\">LIÊN HỆ VỚI LUẬT VIỆT NAM</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Khái niệm <b>“mối nguy”</b> của ILO tương ứng với khái niệm <b>“yếu tố nguy hiểm, yếu tố có hại”</b> trong Luật ATVSLĐ 2015.</div></div></div></div><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#118577\">MỐI NGUY CÓ THỂ LÀ...</div><div class=\"m-grid2\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #f5b301\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#0b463f\">Vật thể</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Thang gãy nấc, ống đồng có ba via, dây điện hở</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #f5b301\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#0b463f\">Chất</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Gas lạnh R600a, dầu bôi trơn, hơi sơn cách điện</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #f5b301\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#0b463f\">Nguồn năng lượng</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Điện 220V, ngọn lửa hàn, áp suất trong hệ thống</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #f5b301\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#0b463f\">Điều kiện làm việc</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Sàn trơn ướt, thiếu ánh sáng, không gian chật hẹp</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #f5b301\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#0b463f\">Cách thức làm việc</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Ngồi xổm lâu, mang vác máy nén sai tư thế</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #f5b301\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#0b463f\">Cách tổ chức công việc</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Ép tiến độ, làm một mình trên cao, không nghỉ giữa ca</div></div></div></div>"},{"k":11,"kicker":"Bài 1 · Khái niệm 6 – 7","title":"Tai nạn lao động & Bệnh nghề nghiệp","sub":"","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #c0392b\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c0392b\">TAI NẠN LAO ĐỘNG (TNLĐ)</div><div class=\"t\" style=\"font-size:16px;color:#4a6a66\">Là tai nạn <b>gây tổn thương cho bất kỳ bộ phận, chức năng nào của cơ thể</b> hoặc <b>gây tử vong</b> cho người lao động, xảy ra trong quá trình lao động, gắn liền với việc thực hiện công việc, nhiệm vụ lao động.</div><div class=\"t\" style=\"font-size:13.5px;color:#9bb3af\">Điều 3, Luật ATVSLĐ 2015</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #c98200\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c98200\">BỆNH NGHỀ NGHIỆP (BNN)</div><div class=\"t\" style=\"font-size:16px;color:#4a6a66\">Là bệnh <b>phát sinh do điều kiện lao động có hại</b> của nghề nghiệp tác động đối với người lao động.</div><div class=\"t\" style=\"font-size:13.5px;color:#9bb3af\">Điều 3, Luật ATVSLĐ 2015</div></div></div></div><div class=\"m-box\" style=\"background:#edf8f6\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#118577\">SO SÁNH ĐỂ NHỚ</div><div class=\"m-tblw\"><table class=\"m-tbl\"><tbody><tr><td style=\"background:#0F6A5F;color:#FFFFFF;font-weight:700\">Tiêu chí</td><td style=\"background:#0F6A5F;color:#FFFFFF;font-weight:700\">Tai nạn lao động</td><td style=\"background:#0F6A5F;color:#FFFFFF;font-weight:700\">Bệnh nghề nghiệp</td></tr><tr><td style=\"background:#FFFFFF;color:#4A6A66;font-weight:700\">Thời gian xuất hiện</td><td style=\"background:#FFFFFF;color:#4A6A66;font-weight:400\">Đột ngột, tức thì</td><td style=\"background:#FFFFFF;color:#4A6A66;font-weight:400\">Từ từ, sau thời gian dài tiếp xúc</td></tr><tr><td style=\"background:#FFFFFF;color:#4A6A66;font-weight:700\">Nguyên nhân</td><td style=\"background:#FFFFFF;color:#4A6A66;font-weight:400\">Yếu tố nguy hiểm</td><td style=\"background:#FFFFFF;color:#4A6A66;font-weight:400\">Yếu tố có hại</td></tr><tr><td style=\"background:#FFFFFF;color:#4A6A66;font-weight:700\">Ví dụ nghề điện lạnh</td><td style=\"background:#FFFFFF;color:#4A6A66;font-weight:400\">Điện giật, ngã thang, bỏng lửa hàn</td><td style=\"background:#FFFFFF;color:#4A6A66;font-weight:400\">Điếc nghề nghiệp, bụi phổi, viêm phế quản</td></tr></tbody></table></div></div>"},{"k":12,"kicker":"Bài 1 · Khái niệm 8 – 9","title":"Người lao động & Người sử dụng lao động","sub":"Căn cứ khoản 1, 2 Điều 3 Bộ luật Lao động 2019 (thay thế Bộ luật Lao động 2012 từ 01/01/2021)","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box dark\" style=\"background:#0b463f\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffd75e\">NGƯỜI LAO ĐỘNG (NLĐ)</div><div class=\"t\" style=\"font-size:16px;color:#dff2ee\">Là người làm việc cho người sử dụng lao động <b style=\"color:#FFD75E\">theo thỏa thuận</b>, được trả lương và chịu sự <b style=\"color:#FFD75E\">quản lý, điều hành, giám sát</b> của người sử dụng lao động.</div><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><div class=\"t\" style=\"font-size:15px;color:#bfe2db\"><b>Độ tuổi lao động tối thiểu: đủ 15 tuổi.</b> Học sinh đi làm thêm, thực tập có hưởng lương → cũng là NLĐ.</div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #c98200\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c98200\">NGƯỜI SỬ DỤNG LAO ĐỘNG (NSDLĐ)</div><div class=\"t\" style=\"font-size:16px;color:#4a6a66\">Là doanh nghiệp, cơ quan, tổ chức, hợp tác xã, hộ gia đình, cá nhân có <b>thuê mướn, sử dụng người lao động làm việc cho mình theo thỏa thuận</b>; nếu là cá nhân thì phải có năng lực hành vi dân sự đầy đủ.</div><div class=\"m-box\" style=\"background:#fff6de\"><div class=\"t\" style=\"font-size:15px;color:#c98200\">Chủ cửa hàng điện lạnh, công ty lắp đặt điều hòa, trung tâm bảo hành → đều là NSDLĐ.</div></div></div></div></div><div class=\"m-box\" style=\"background:#edf8f6;border:1px solid #3fb5a3\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#118577\">MỐI QUAN HỆ HAI CHIỀU VỀ ATVSLĐ</div><div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb\"><div class=\"t th\" style=\"font-size:16px;font-weight:800;color:#c98200\">NSDLĐ</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Bảo đảm điều kiện làm việc an toàn, huấn luyện, trang cấp PTBVCN</div></div></div><div class=\"m-cell\"><span class=\"m-badge emo\" style=\"color:#3FB5A3;\">→</span></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb\"><div class=\"t th\" style=\"font-size:16px;font-weight:800;color:#0f6a5f\">NLĐ</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Chấp hành nội quy, sử dụng PTBVCN, báo cáo nguy cơ mất an toàn</div></div></div><div class=\"m-cell\"><span class=\"m-badge emo\" style=\"color:#3FB5A3;\">→</span></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb\"><div class=\"t th\" style=\"font-size:16px;font-weight:800;color:#1e8449\">KẾT QUẢ</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Không TNLĐ – không BNN – sản xuất ổn định – thu nhập bền vững</div></div></div></div></div>"},{"k":13,"kicker":"Bài 1 · Cập nhật pháp luật","title":"Điểm mới của Bộ luật Lao động 2019","sub":"Bộ luật Lao động số 45/2019/QH14 có hiệu lực từ 01/01/2021, thay thế Bộ luật Lao động 2012","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #c0392b\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c0392b;text-transform:uppercase;letter-spacing:.04em\">Bộ luật Lao động 2012 · Đã hết hiệu lực</div><div class=\"t\" style=\"font-size:16px;color:#4a6a66\">“Người lao động là người <s style=\"color:#C0392B\">từ đủ 15 tuổi trở lên</s>, có khả năng lao động, <s style=\"color:#C0392B\">làm việc theo hợp đồng lao động</s>, được trả lương và chịu sự quản lý, điều hành của người sử dụng lao động.”</div><div class=\"t\" style=\"font-size:13.5px;color:#8aa5a1\">Khoản 1 Điều 3 – Bộ luật Lao động số 10/2012/QH13</div></div></div><div class=\"m-cell\"><span class=\"m-badge emo\" style=\"background:#F5B301;color:#08312E;\">→</span></div><div class=\"m-cell\"><div class=\"m-box dark\" style=\"background:#0b463f\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffd75e;text-transform:uppercase;letter-spacing:.04em\">Bộ luật Lao động 2019 · Đang áp dụng</div><div class=\"t\" style=\"font-size:16px;color:#dff2ee\">“Người lao động là người làm việc cho người sử dụng lao động <b style=\"color:#FFD75E\">theo thỏa thuận</b>, được trả lương và chịu sự quản lý, điều hành, <b style=\"color:#FFD75E\">giám sát</b> của người sử dụng lao động.”</div><div class=\"t\" style=\"font-size:15px;color:#ffffff\">Độ tuổi lao động tối thiểu: <b style=\"color:#FFD75E\">đủ 15 tuổi</b> (trừ một số trường hợp đặc biệt do luật quy định).</div><div class=\"t\" style=\"font-size:13.5px;color:#9fc9c2\">Khoản 1 Điều 3 – Bộ luật Lao động số 45/2019/QH14</div></div></div></div><div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #c0392b\"><div class=\"m-irow\"><span class=\"m-badge emo\" style=\"background:#C0392B;color:#fff;\">✕</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c0392b;text-transform:uppercase;letter-spacing:.04em\">Bỏ 2 dấu hiệu</div></div></div><div class=\"t\" style=\"font-size:15px\"><b>“Làm việc theo hợp đồng lao động”</b> và <b>“từ đủ 15 tuổi trở lên”</b> không còn nằm trong khái niệm người lao động.</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #118577\"><div class=\"m-irow\"><span class=\"m-badge emo\" style=\"background:#118577;color:#fff;\">+</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#118577;text-transform:uppercase;letter-spacing:.04em\">Mở rộng bảo vệ</div></div></div><div class=\"t\" style=\"font-size:15px\">Có trả lương và chịu sự quản lý, điều hành, giám sát thì vẫn là quan hệ lao động, <b>kể cả khi hai bên gọi bằng tên khác</b> (Điều 13).</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #c98200\"><div class=\"m-irow\"><span class=\"m-badge emo\" style=\"background:#C98200;color:#fff;\">=</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c98200;text-transform:uppercase;letter-spacing:.04em\">Giữ nguyên</div></div></div><div class=\"t\" style=\"font-size:15px\">Tuổi lao động tối thiểu vẫn là <b>đủ 15 tuổi</b>. Người từ đủ 15 đến dưới 18 tuổi: tối đa <b>8 giờ/ngày, 40 giờ/tuần</b> (Điều 146).</div></div></div></div>"},{"k":14,"kicker":"Bài 1 · Mục 1.2","title":"Mục đích của ATVSLĐ","sub":"Làm tốt ATVSLĐ mang lại lợi ích cho cả hai phía","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box dark\" style=\"background:#0b463f\"><div class=\"m-irow\"><span class=\"m-badge emo\" style=\"background:rgba(255,255,255,.14);\">👨‍🔧</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:16px;font-weight:800;color:#ffd75e\">ĐỐI VỚI NGƯỜI LAO ĐỘNG</div></div></div><div class=\"t\" style=\"font-size:16px;color:#dff2ee\"><div class=\"li dot\" style=\"--c:#F5B301\">Bảo vệ <b>sức khỏe và tính mạng</b> khi làm việc</div><div class=\"li dot\" style=\"--c:#F5B301\">Đảm bảo <b>công việc và thu nhập ổn định</b></div><div class=\"li dot\" style=\"--c:#F5B301\">Góp phần <b>phát triển bản thân</b> và cộng đồng</div><div class=\"li dot\" style=\"--c:#F5B301\">Yên tâm gắn bó lâu dài với nghề đã chọn</div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #f5b301\"><div class=\"m-irow\"><span class=\"m-badge emo\" style=\"background:#FFF6DE;\">🏭</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:16px;font-weight:800;color:#c98200\">ĐỐI VỚI NGƯỜI SỬ DỤNG LAO ĐỘNG</div></div></div><div class=\"t\" style=\"font-size:16px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#F5B301\"><b>Ổn định sản xuất</b>, không gián đoạn vì tai nạn</div><div class=\"li dot\" style=\"--c:#F5B301\"><b>Tăng lợi nhuận</b>, giảm chi phí bồi thường</div><div class=\"li dot\" style=\"--c:#F5B301\">Nâng cao <b>hình ảnh và vị thế</b> doanh nghiệp</div><div class=\"li dot\" style=\"--c:#F5B301\">Giữ chân được người thợ lành nghề</div></div></div></div></div><div class=\"m-box\" style=\"background:#edf8f6;border:1px solid #3fb5a3\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#118577\">CHI PHÍ CỦA MỘT VỤ TAI NẠN LAO ĐỘNG</div><div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#c0392b\">Người lao động</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Đau đớn, mất khả năng lao động, mất thu nhập, gánh nặng cho gia đình</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#c0392b\">Doanh nghiệp</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Ngừng việc, bồi thường, mất uy tín, bị xử phạt</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#c0392b\">Xã hội</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Chi phí y tế, mất nguồn nhân lực, gánh nặng an sinh</div></div></div></div></div>"},{"k":15,"kicker":"Bài 1 · Mục 1.2","title":"Thực trạng ATVSLĐ trên thế giới","sub":"Theo ước tính của Tổ chức Lao động Quốc tế (ILO)","html":"<div class=\"m-box dark\" style=\"background:#08312e\">\n<div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffd75e\">MỖI NĂM TRÊN TOÀN THẾ GIỚI</div>\n<div class=\"t th\" style=\"font-size:30px;font-weight:800;color:#ffffff;line-height:1.15\">2,78 triệu</div>\n<div class=\"t\" style=\"font-size:15px;color:#bfe2db\">người tử vong do bệnh liên quan tới công việc và tai nạn lao động, trong đó:</div>\n<div class=\"m-grid2\">\n<div class=\"m-cell\"><div class=\"m-box\" style=\"background:rgba(255,255,255,.08)\"><div class=\"t th\" style=\"font-size:24px;font-weight:800;color:#ffd75e;line-height:1.15\">2,4 triệu</div><div class=\"t\" style=\"font-size:14px;color:#bfe2db\">ca tử vong do <b>bệnh liên quan tới nghề nghiệp</b></div></div></div>\n<div class=\"m-cell\"><div class=\"m-box\" style=\"background:rgba(255,255,255,.08)\"><div class=\"t th\" style=\"font-size:24px;font-weight:800;color:#ffd75e;line-height:1.15\">380.000</div><div class=\"t\" style=\"font-size:14px;color:#bfe2db\">người chết do <b>tai nạn lao động</b></div></div></div>\n</div></div><div class=\"m-box\" style=\"background:#fbe4e1;border:1px solid #c0392b\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c0392b\">LAO ĐỘNG TRẺ — NHÓM DỄ BỊ TỔN THƯƠNG NHẤT</div><div class=\"m-grid2\"><div class=\"m-cell\"><div class=\"t th\" style=\"font-size:21px;font-weight:800;color:#c0392b;line-height:1.15\">Cao hơn<br/><span>40%</span></div></div><div class=\"m-cell\"><div class=\"t\" style=\"font-size:15px\">là nguy cơ bị <b>tai nạn lao động</b> và <b>bệnh nghề nghiệp</b> của lao động trẻ <b>15–24 tuổi</b> so với các nhóm lao động khác.</div></div></div><div class=\"m-box\" style=\"background:#ffffff\"><div class=\"t\" style=\"font-size:15px;color:#c0392b\">Nói cách khác: cứ 10 vụ tai nạn xảy ra với thợ lành nghề thì có tới 14 vụ xảy ra với thợ trẻ mới vào nghề.</div></div></div><div class=\"m-img\"><img data-asset=\"img-a.jpg\" alt=\"\"></div>"},{"k":16,"kicker":"Bài 1 · Mục 1.2","title":"Thực trạng ATVSLĐ tại Việt Nam","sub":"Báo cáo tình hình TNLĐ năm 2017 của Bộ LĐTBXH và Bộ Y tế","html":"<div class=\"m-grid2\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #0f6a5f\"><div class=\"t th\" style=\"font-size:30px;font-weight:800;color:#0f6a5f;line-height:1.15\">8.956</div><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#08312e\">vụ tai nạn lao động</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">xảy ra trên toàn quốc</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #118577\"><div class=\"t th\" style=\"font-size:30px;font-weight:800;color:#118577;line-height:1.15\">9.173</div><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#08312e\">người bị nạn</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">trong các vụ TNLĐ</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #c98200\"><div class=\"t th\" style=\"font-size:30px;font-weight:800;color:#c98200;line-height:1.15\">898</div><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#08312e\">vụ TNLĐ chết người</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">chiếm 10% tổng số vụ</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #c0392b\"><div class=\"t th\" style=\"font-size:30px;font-weight:800;color:#c0392b;line-height:1.15\">928</div><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#08312e\">người chết</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">trung bình gần 3 người/ngày</div></div></div></div><div class=\"m-box\" style=\"background:#ffffff;border-left:5px solid #c98200\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color: r:#ffffff\">Các em đang ở đây — vừa học nghề, vừa bắt đầu tiếp xúc với máy móc, điện và hóa chất.</div></div></div></div><div class=\"m-cell\"><div class=\"m-box dark\" style=\"background:#0b463f\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffd75e\">MỘT SỐ MỐC TUỔI CẦN NHỚ</div><div class=\"m-grid2\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffffff\">Đủ 15 tuổi</div><div class=\"t\" style=\"font-size:13.5px;color:#afd3cd\">Tuổi lao động tối thiểu</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffffff\">Dưới 18 tuổi</div><div class=\"t\" style=\"font-size:13.5px;color:#afd3cd\">Là lao động chưa thành niên</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffffff\">15 – 24 tuổi</div><div class=\"t\" style=\"font-size:13.5px;color:#afd3cd\">Được gọi là lao động trẻ</div></div></div></div></div><div class=\"m-box\" style=\"background:#fbe4e1;border:1px solid #c0392b\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c0392b\">CON SỐ CẢNH BÁO</div><div class=\"t th\" style=\"font-size:30px;font-weight:800;color:#c0392b;line-height:1.15\">40%</div><div class=\"t\" style=\"font-size:15px\">là mức nguy cơ TNLĐ, BNN <b>cao hơn</b> của lao động trẻ so với các nhóm lao động khác (ILO).</div></div></div></div><div class=\"m-box\" style=\"background:#fff6de;border:1px solid #f5b301\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c98200\">ĐIỀU NÀY KHÔNG CÓ NGHĨA LAO ĐỘNG TRẺ “KÉM”</div><div class=\"t\" style=\"font-size:16px;color:#4a6a66\">Nguy cơ cao hơn đến từ những nguyên nhân <b>khách quan</b> về thể chất, tâm lý, kinh nghiệm và vị thế tại nơi làm việc — tất cả đều có thể solid #0f6a5f\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:#0F6A5F;color:#fff;\">c</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#08312e\">Thiếu kỹ năng và kinh nghiệm làm việc</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#0F6A5F\">Chưa nhận diện được mối nguy tiềm ẩn quanh mình</div><div class=\"li dot\" style=\"--c:#0F6A5F\">Chưa thành thạo quy trình, thao tác an toàn khi xử lý sự cố</div><div class=\"li dot\" style=\"--c:#0F6A5F\">Chưa biết cách sử dụng đúng phương tiện bảo vệ cá nhân</div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #118577\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:#118577;color:#fff;\">d</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#08312e\">Thiếu đại diện tại nơi làm việc</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#118577\">Ít tiếng nói trong tổ chức công đoàn, khó phản ánh điều kiện làm việc</div><div class=\"li dot\" style=\"--c:#118577\">Dễ bị phân công công việc nặng nhọc, độc hại mà không dám khiếu nại</div><div class=\"li dot\" style=\"--c:#118577\">Ít được tham gia xây dựng nội quy, quy trình làm việc an toàn</div></div></div></div></div>"},{"k":19,"kicker":"Bài 1 · Mục 1.3","title":"Vì sao ATVSLĐ đặc biệt quan trọng với lao động trẻ?","sub":"","html":"<div class=\"m-box dark\" style=\"background:#0b463f\"><div class=\"t\" style=\"font-size:18px;color:#ffffff\">Làm việc trong điều kiện an toàn là <b style=\"color:#FFD75E\">quyền cơ bản</b> của mọi người lao động — không ai phải đánh đổi sức khỏe và tính mạng để có việc làm.</div></div><div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:#118577;color:#fff;\">1</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:18px;font-weight:700;color:#08312e\">Bảo vệ cả cuộc đời lao động phía trước</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Một chấn thương ở tuổi 17 có thể để lại di chứng suốt 40 năm còn lại của nghề nghiệp.</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:#C98200;color:#fff;\">2</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:18px;font-weight:700;color:#08312e\">Hình thành thói quen an toàn từ đầu</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Thói quen hình thành lúc học nghề sẽ theo người thợ suốt đời — sửa sau rất khó.</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:#C0392B;color:#fff;\">3</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:18px;font-weight:700;color:#08312e\">Bảo vệ gia đình và tương lai bản thân</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Mất khả năng lao động đồng nghĩa mất thu nhập, trở thành gánh nặng cho gia đình.</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:#0F6A5F;color:#fff;\">4</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:18px;font-weight:700;color:#08312e\">Lao động trẻ là nguồn nhân lực quốc gia</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Thế hệ thợ trẻ khỏe mạnh, an toàn là nền tảng phát triển của ngành và của đất nước.</div></div></div></div>"},{"k":20,"kicker":"Bài 1 · Mục 2","title":"Quyền và nghĩa vụ về ATVSLĐ tại nơi làm việc","sub":"Căn cứ Điều 6 và Điều 7, Luật An toàn, vệ sinh lao động 2015","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #0f6a5f\"><div class=\"t th\" style=\"font-size:18px;font-weight:800;color:#08312e\">NGƯỜI LAO ĐỘNG<br/>làm việc theo HĐLĐ</div><div class=\"m-pill\">7 quyền · 4 nghĩa vụ</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Nhóm được bảo vệ đầy đủ nhất theo Luật ATVSLĐ 2015</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #c98200\"><div class=\"t th\" style=\"font-size:18px;font-weight:800;color:#08312e\">NGƯỜI LAO ĐỘNG<br/>không theo HĐLĐ</div><div class=\"m-pill\">5 quyền · 3 nghĩa vụ</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Thợ tự do, thợ nhận khoán sửa chữa điện lạnh tại nhà dân</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #118577\"><div class=\"t th\" style=\"font-size:18px;font-weight:800;color:#08312e\">NGƯỜI SỬ DỤNG<br/>LAO ĐỘNG</div><div class=\"m-pill\">7 nghĩa vụ · 4 quyền</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Chủ cửa hàng, doanh nghiệp lắp đặt và bảo trì điện lạnh</div></div></div></div><div class=\"m-box\" style=\"background:#edf8f6\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#118577\">NGUYÊN TẮC CỐT LÕI CẦN GHI NHỚ</div><div class=\"m-grid2\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#0b463f\">Quyền đi đôi với nghĩa vụ</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Em có quyền được bảo vệ, nhưng cũng có nghĩa vụ tuân thủ nội quy và dùng đúng PTBVCN.</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#0b463f\">Quyền từ chối công việc nguy hiểm</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Khi thấy rõ nguy cơ đe dọa nghiêm trọng tính mạng, em được rời nơi làm việc mà <b>vẫn hưởng đủ lương</b>.</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#0b463f\">NSDLĐ không được ép buộc</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">NSDLĐ không được buộc NLĐ tiếp tục làm việc khi có nguy cơ TNLĐ nghiêm trọng.</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#0b463f\">Được khiếu nại, tố cáo</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Cả NLĐ và NSDLĐ đều có quyền khiếu nại, tố cáo hoặc khởi kiện theo quy định pháp luật.</div></div></div></div></div>"},{"k":21,"kicker":"Bài 1 · Mục 2.1.1","title":"7 quyền của NLĐ làm việc theo hợp đồng lao động","sub":"Điều 6, Luật An toàn, vệ sinh lao động 2015","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #118577\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:#D8F0EB;color:#118577;\">a</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#08312e\">Được đảm bảo điều kiện làm việc ATVSLĐ</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Được yêu cầu NSDLĐ có trách nhiệm bảo đảm điều kiện làm việc an toàn, vệ sinh.</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #118577\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:#D8F0EB;color:#118577;\">b</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#08312e\">Được cung cấp thông tin đầy đủ</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Về các yếu tố nguy hiểm, yếu tố có hại tại nơi làm việc và biện pháp phòng chống.</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #118577\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:#D8F0EB;color:#118577;\">c</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#08312e\">Được đào tạo, huấn luyện về ATVSLĐ</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Trước khi nhận việc và định kỳ trong quá trình làm việc.</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #118577\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:#D8F0EB;color:#118577;\">d</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#08312e\">Được hưởng chế độ bảo hộ lao động</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Chăm sóc sức khỏe, khám phát hiện BNN, đóng bảo hiểm TNLĐ–BNN và hưởng chế độ khi bị TNLĐ, BNN.</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #118577\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:#D8F0EB;color:#118577;\">e</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#08312e\">Được bố trí công việc phù hợp sau điều trị</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Yêu cầu NSDLĐ bố trí công việc phù hợp sau khi điều trị ổn định do bị TNLĐ, BNN.</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #c0392b\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:#FBE4E1;color:#C0392B;\">f</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#08312e\">Được từ chối công việc nguy hiểm</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Từ chối làm việc hoặc rời nơi làm việc mà <b>vẫn được trả đủ lương</b> và không bị coi là vi phạm kỷ luật khi thấy rõ nguy cơ TNLĐ đe dọa nghiêm trọng tính mạng, sức khỏe.</div></div></div></div><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #118577\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:#D8F0EB;color:#118577;\">g</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#08312e\">Được khiếu nại, tố cáo, khởi kiện</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Theo quy định của pháp luật khi quyền về ATVSLĐ bị xâm phạm.</div></div></div></div>"},{"k":22,"kicker":"Bài 1 · Mục 2.1.2","title":"4 nghĩa vụ của NLĐ làm việc theo HĐLĐ","sub":"Điều 6, Luật An toàn, vệ sinh lao động 2015","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #c98200\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:#FFF6DE;color:#C98200;\">a</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#08312e\">Chấp hành nội quy, quy trình, biện pháp làm việc an toàn</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Tuân thủ nội quy, quy trình và biện pháp bảo đảm ATVSLĐ tại nơi làm việc — kể cả khi không có ai giám sát.</div><div class=\"m-box\" style=\"background:#edf8f6\"><div class=\"t\" style=\"font-size:13.5px;color:#0f6a5f\">Ví dụ: luôn ngắt aptomat và treo biển cảnh báo trước khi sửa chữa tủ điện.</div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #c98200\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:#FFF6DE;color:#C98200;\">b</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#08312e\">Sử dụng và bảo quản phương tiện bảo vệ cá nhân</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Dùng đúng và bảo quản các PTBVCN, thiết bị bảo đảm ATVSLĐ đã được trang cấp tại nơi làm việc.</div><div class=\"m-box\" style=\"background:#edf8f6\"><div class=\"t\" style=\"font-size:13.5px;color:#0f6a5f\">Ví dụ: đeo kính bảo hộ khi cắt ống đồng, mang găng tay cách điện khi đo điện.</div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #c98200\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:#FFF6DE;color:#C98200;\">c</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#08312e\">Báo cáo kịp thời nguy cơ mất an toàn</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Báo ngay với người có trách nhiệm khi phát hiện nguy cơ sự cố kỹ thuật gây mất ATVSLĐ, TNLĐ hoặc BNN.</div><div class=\"m-box\" style=\"background:#edf8f6\"><div class=\"t\" style=\"font-size:13.5px;color:#0f6a5f\">Ví dụ: phát hiện dây nguồn bị nứt vỏ cách điện, báo ngay cho tổ trưởng, không tự ý dùng tiếp.</div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #c98200\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:#FFF6DE;color:#C98200;\">d</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#08312e\">Chủ động tham gia cấp cứu, khắc phục sự cố</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Tham gia cấp cứu và khắc phục sự cố, TNLĐ theo phương án xử lý sự cố, ứng cứu khẩn cấp hoặc khi có lệnh của NSDLĐ.</div><div class=\"m-box\" style=\"background:#edf8f6\"><div class=\"t\" style=\"font-size:13.5px;color:#0f6a5f\">Ví dụ: biết vị trí bình chữa cháy, tủ thuốc cấp cứu và lối thoát hiểm của xưởng.</div></div></div></div></div>"},{"k":23,"kicker":"Bài 1 · Mục 2.2","title":"NLĐ làm việc không theo hợp đồng lao động","sub":"Thợ điện lạnh tự do, nhận khoán sửa chữa tại nhà dân — vẫn được pháp luật bảo vệ","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #118577\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#118577\">5 QUYỀN LỢI</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#3FB5A3\">Được nhà nước, xã hội và gia đình <b>tạo điều kiện</b> để làm việc trong điều kiện ATVSLĐ</div><div class=\"li dot\" style=\"--c:#3FB5A3\">Được <b>tiếp nhận thông tin</b>, tuyên truyền, giáo dục về công tác ATVSLĐ</div><div class=\"li dot\" style=\"--c:#3FB5A3\">Được <b>huấn luyện ATVSLĐ</b> khi làm các công việc có yêu cầu nghiêm ngặt về ATVSLĐ</div><div class=\"li dot\" style=\"--c:#3FB5A3\">Được tham gia và hưởng <b>bảo hiểm TNLĐ theo hình thức tự nguyện</b></div><div class=\"li dot\" style=\"--c:#3FB5A3\">Được <b>khiếu nại, tố cáo hoặc khởi kiện</b> theo quy định pháp luật</div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #c98200\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c98200\">3 NGHĨA VỤ</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#F5B301\"><b>Chịu trách nhiệm về ATVSLĐ</b> đối với công việc do mình thực hiện theo quy định pháp luật</div><div class=\"li dot\" style=\"--c:#F5B301\"><b>Bảo đảm ATVSLĐ đối với những người có liên quan</b> trong quá trình lao động — chủ nhà, người đi đường, đồng nghiệp</div><div class=\"li dot\" style=\"--c:#F5B301\"><b>Thông báo với chính quyền địa phương</b> để có biện pháp ngăn chặn kịp thời các hành vi gây mất ATVSLĐ</div></div></div></div></div><div class=\"m-box dark\" style=\"background:#0b463f\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffd75e\">LIÊN HỆ THỰC TẾ NGHỀ ĐIỆN LẠNH</div><div class=\"t\" style=\"font-size:16px;color:#dff2ee\">Rất nhiều thợ điện lạnh làm việc <b style=\"color:#FFD75E\">tự do, nhận khoán theo từng công trình</b>, không ký hợp đồng lao động. Nhóm này thường <b style=\"color:#FFD75E\">thiếu người giám sát an toàn, không được trang cấp PTBVCN</b> và không có bảo hiểm — vì vậy nguy cơ tai nạn lại càng cao.</div><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><div class=\"t\" style=\"font-size:13.5px;font-weight:600;color:#dff2ee\">Tự trang bị PTBVCN đầy đủ cho mình</div></div><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><div class=\"t\" style=\"font-size:13.5px;font-weight:600;color:#dff2ee\">Chủ động tham gia bảo hiểm TNLĐ tự nguyện</div></div><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><div class=\"t\" style=\"font-size:13.5px;font-weight:600;color:#dff2ee\">Không nhận việc vượt quá năng lực, tay nghề</div></div><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><div class=\"t\" style=\"font-size:13.5px;font-weight:600;color:#dff2ee\">Luôn làm việc nhóm 2 người khi làm trên cao</div></div></div>"},{"k":24,"kicker":"Bài 1 · Mục 2.3.1","title":"7 nghĩa vụ của người sử dụng lao động","sub":"Điều 7, Luật An toàn, vệ sinh lao động 2015 — đây là những điều NSDLĐ PHẢI làm cho em","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #c98200\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:#FFF6DE;color:#C98200;\">a</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#08312e\">Xây dựng và tổ chức thực hiện ATVSLĐ</div></div></div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Chủ động phối hợp bảo đảm ATVSLĐ và <b>đóng bảo hiểm TNLĐ, BNN</b> cho người lao động.</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #c98200\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:#FFF6DE;color:#C98200;\">b</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#08312e\">Huấn luyện và trang bị đầy đủ</div></div></div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Tổ chức huấn luyện, hướng dẫn; trang bị đầy đủ phương tiện, công cụ lao động; chăm sóc sức khỏe, khám phát hiện BNN; thực hiện đầy đủ chế độ với người bị TNLĐ, BNN.</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #c98200\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:#FFF6DE;color:#C98200;\">c</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#08312e\">Không ép buộc NLĐ làm việc nguy hiểm</div></div></div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Không được buộc NLĐ tiếp tục làm việc hoặc trở lại nơi làm việc khi có nguy cơ TNLĐ đe dọa nghiêm trọng tính mạng, sức khỏe.</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #c98200\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:#FFF6DE;color:#C98200;\">d</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#08312e\">Cử người giám sát, kiểm tra</div></div></div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Giám sát việc thực hiện nội quy, quy trình, biện pháp bảo đảm ATVSLĐ tại nơi làm việc.</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #c98200\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:#FFF6DE;color:#C98200;\">e</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#08312e\">Bố trí bộ phận làm công tác ATVSLĐ</div></div></div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Có bộ phận hoặc người chuyên trách/bán chuyên trách về ATVSLĐ theo quy mô doanh nghiệp.</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #c98200\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:#FFF6DE;color:#C98200;\">f</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#08312e\">Khai báo, điều tra, thống kê, báo cáo</div></div></div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Thực hiện đầy đủ việc khai báo, điều tra, thống kê và báo cáo TNLĐ, BNN theo quy định.</div></div></div></div><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #c98200\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:#FFF6DE;color:#C98200;\">g</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#08312e\">Lấy ý kiến công đoàn cơ sở</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Khi xây dựng kế hoạch, nội quy, quy trình, biện pháp bảo đảm ATVSLĐ.</div></div></div></div>"},{"k":25,"kicker":"Bài 1 · Mục 2.3.2","title":"4 quyền của người sử dụng lao động","sub":"Điều 7, Luật An toàn, vệ sinh lao động 2015","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #118577\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:#118577;color:#fff;\">a</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#08312e\">Yêu cầu NLĐ chấp hành quy định ATVSLĐ</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Yêu cầu người lao động phải chấp hành các nội quy, quy trình, biện pháp bảo đảm ATVSLĐ tại nơi làm việc.</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #c98200\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:#C98200;color:#fff;\">b</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#08312e\">Khen thưởng và kỷ luật</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Khen thưởng NLĐ chấp hành tốt và <b>kỷ luật NLĐ vi phạm</b> trong việc thực hiện ATVSLĐ.</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #0f6a5f\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:#0F6A5F;color:#fff;\">c</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#08312e\">Khiếu nại, tố cáo, khởi kiện</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Khiếu nại, tố cáo hoặc khởi kiện theo quy định của pháp luật.</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #c0392b\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:#C0392B;color:#fff;\">d</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:16px;font-weight:700;color:#08312e\">Huy động NLĐ ứng cứu khẩn cấp</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Huy động người lao động tham gia ứng cứu khẩn cấp, khắc phục sự cố, tai nạn lao động.</div></div></div></div><div class=\"m-box\" style=\"background:#edf8f6;border:1px solid #3fb5a3\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#118577\">GHI NHỚ QUAN TRỌNG CHO HỌC SINH THỰC TẬP</div><div class=\"t\" style=\"font-size:16px;color:#4a6a66\">Khi đi thực tập hoặc làm thêm tại cửa hàng điện lạnh, nếu NSDLĐ <b>không trang cấp PTBVCN</b>, <b>không huấn luyện an toàn</b>, hoặc <b>ép làm công việc nguy hiểm</b> — em có quyền yêu cầu, từ chối và báo với giáo viên hướng dẫn hoặc nhà trường. Đó là quyền được pháp luật bảo vệ, không phải là “làm khó chủ”.</div></div>"},{"k":26,"kicker":"Bài 1 · Mục 3","title":"Pháp luật về sử dụng lao động chưa thành niên","sub":"Căn cứ Điều 143 – 147 Bộ luật Lao động 2019 · Rất quan trọng với học sinh 9+ (phần lớn dưới 18 tuổi)","html":"<div class=\"m-box dark\" style=\"background:#0b463f\"><div class=\"m-grid2\"><div class=\"m-cell\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffd75e\">LAO ĐỘNG CHƯA THÀNH NIÊN</div><div class=\"t th\" style=\"font-size:21px;font-weight:800;color:#ffffff;line-height:1.15\">Là người lao động <b style=\"color:#FFD75E\">dưới 18 tuổi</b></div></div><div class=\"m-cell\"><div class=\"m-pill\">Phần lớn học sinh lớp 9+ thuộc nhóm này → áp dụng đầy đủ các quy định bảo vệ</div></div></div></div><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c0392b\">3 NGUYÊN TẮC SỬ DỤNG LAO ĐỘNG CHƯA THÀNH NIÊN</div><div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #c0392b\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:#FBE4E1;color:#C0392B;\">a</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#08312e\">Không làm công việc nặng nhọc, độc hại, nguy hiểm</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Không được sử dụng lao động chưa thành niên làm những công việc nặng nhọc, độc hại, nguy hiểm hoặc nơi làm việc, công việc ảnh hưởng xấu tới nhân cách.</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #c0392b\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:#FBE4E1;color:#C0392B;\">b</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#08312e\">Giới hạn thời giờ làm việc</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Thời giờ làm việc của NLĐ chưa thành niên từ đủ 15 đến dưới 18 tuổi <b>không quá 8 giờ/ngày và không quá 40 giờ/tuần</b> (Điều 146 Bộ luật Lao động 2019).</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #c0392b\"><div class=\"m-irow\"><span class=\"m-badge\" style=\"background:#FBE4E1;color:#C0392B;\">c</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#08312e\">Hạn chế làm thêm giờ và làm ban đêm</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Người từ đủ 15 đến dưới 18 tuổi chỉ được làm thêm giờ, làm việc vào ban đêm trong <b>một số nghề và công việc</b> theo quy định của Bộ LĐTBXH.</div></div></div></div><div class=\"m-box\" style=\"background:#fbe4e1;border:1px solid #c0392b\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c0392b\">CẢNH BÁO ĐẶC BIỆT VỚI NGHỀ ĐIỆN LẠNH</div><div class=\"t\" style=\"font-size:13.5px\">Trong danh mục công việc cấm có <b>“bảo trì, bảo dưỡng thiết bị, máy móc”</b>, <b>“sản xuất, sử dụng hoặc vận chuyển hóa chất, khí gas, chất nổ”</b> và <b>“nấu, thổi, đúc, cán, dập, hàn kim loại”</b> — đây chính là các thao tác cốt lõi của nghề điện lạnh. Học sinh dưới 18 tuổi chỉ được <b>thực hành có giám sát trong môi trường đào tạo</b>.</div></div>"},{"k":27,"kicker":"Bài 1 · Mục 3.3","title":"Công việc và nơi làm việc CẤM sử dụng lao động chưa thành niên","sub":"","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #c0392b\"><div class=\"m-box dark\" style=\"background:#c0392b\"><div class=\"t th\" style=\"font-size:16px;font-weight:800;color:#ffffff\">CẤM LÀM CÁC CÔNG VIỆC SAU</div></div><div class=\"m-box\" style=\"background:#fbe4e1\"><div class=\"m-irow\"><span class=\"m-badge emo\" style=\"background:#C0392B;color:#fff;\">✕</span><div class=\"m-irest\"><div class=\"t\" style=\"font-size:15px\">Mang, vác, nâng các vật nặng <b>vượt quá thể trạng</b> của người chưa thành niên</div></div></div></div><div class=\"m-box\" style=\"background:#fbe4e1\"><div class=\"m-irow\"><span class=\"m-badge emo\" style=\"background:#C0392B;color:#fff;\">✕</span><div class=\"m-irest\"><div class=\"t\" style=\"font-size:15px\">Sản xuất, sử dụng hoặc <b>vận chuyển hóa chất, khí gas, chất nổ</b></div></div></div></div><div class=\"m-box\" style=\"background:#fbe4e1\"><div class=\"m-irow\"><span class=\"m-badge emo\" style=\"background:#C0392B;color:#fff;\">✕</span><div class=\"m-irest\"><div class=\"t\" style=\"font-size:15px\"><b>Bảo trì, bảo dưỡng thiết bị, máy móc</b></div></div></div></div><div class=\"m-box\" style=\"background:#fbe4e1\"><div class=\"m-irow\"><span class=\"m-badge emo\" style=\"background:#C0392B;color:#fff;\">✕</span><div class=\"m-irest\"><div class=\"t\" style=\"font-size:15px\"><b>Phá dỡ</b> các công trình xây dựng</div></div></div></div><div class=\"m-box\" style=\"background:#fbe4e1\"><div class=\"m-irow\"><span class=\"m-badge emo\" style=\"background:#C0392B;color:#fff;\">✕</span><div class=\"m-irest\"><div class=\"t\" style=\"font-size:15px\">Nấu, thổi, đúc, cán, dập, <b>hàn kim loại</b></div></div></div></div><div class=\"m-box\" style=\"background:#fbe4e1\"><div class=\"m-irow\"><span class=\"m-badge emo\" style=\"background:#C0392B;color:#fff;\">✕</span><div class=\"m-irest\"><div class=\"t\" style=\"font-size:15px\">Lặn biển, đánh bắt cá xa bờ</div></div></div></div><div class=\"m-box\" style=\"background:#fbe4e1\"><div class=\"m-irow\"><span class=\"m-badge emo\" style=\"background:#C0392B;color:#fff;\">✕</span><div class=\"m-irest\"><div class=\"t\" style=\"font-size:15px\">Công việc khác gây <b>tổn hại cho sức khoẻ, an toàn hoặc đạo đức</b> của người chưa thành niên</div></div></div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #c98200\"><div class=\"m-box\" style=\"background:#c98200\"><div class=\"t th\" style=\"font-size:16px;font-weight:800;color:#ffffff\">CẤM LÀM VIỆC TẠI CÁC NƠI SAU</div></div><div class=\"m-box\" style=\"background:#fff6de\"><div class=\"m-irow\"><span class=\"m-badge emo\" style=\"background:#C98200;color:#fff;\">✕</span><div class=\"m-irest\"><div class=\"t\" style=\"font-size:15px\"><b>Dưới nước, dưới lòng đất</b>, trong hang động, trong đường hầm</div></div></div></div><div class=\"m-box\" style=\"background:#fff6de\"><div class=\"m-irow\"><span class=\"m-badge emo\" style=\"background:#C98200;color:#fff;\">✕</span><div class=\"m-irest\"><div class=\"t\" style=\"font-size:15px\"><b>Công trường xây dựng</b></div></div></div></div><div class=\"m-box\" style=\"background:#fff6de\"><div class=\"m-irow\"><span class=\"m-badge emo\" style=\"background:#C98200;color:#fff;\">✕</span><div class=\"m-irest\"><div class=\"t\" style=\"font-size:15px\">Cơ sở giết mổ gia súc</div></div></div></div><div class=\"m-box\" style=\"background:#fff6de\"><div class=\"m-irow\"><span class=\"m-badge emo\" style=\"background:#C98200;color:#fff;\">✕</span><div class=\"m-irest\"><div class=\"t\" style=\"font-size:15px\"><b>Sòng bạc, quán bar, vũ trường</b>, phòng hát karaoke</div></div></div></div><div class=\"m-box\" style=\"background:#fff6de\"><div class=\"m-irow\"><span class=\"m-badge emo\" style=\"background:#C98200;color:#fff;\">✕</span><div class=\"m-irest\"><div class=\"t\" style=\"font-size:15px\">Khách sạn, nhà nghỉ, phòng tắm hơi, phòng xoa bóp</div></div></div></div><div class=\"m-box\" style=\"background:#fff6de\"><div class=\"m-irow\"><span class=\"m-badge emo\" style=\"background:#C98200;color:#fff;\">✕</span><div class=\"m-irest\"><div class=\"t\" style=\"font-size:15px\">Nơi làm việc khác gây <b>tổn hại đến sức khoẻ, sự an toàn và đạo đức</b> của người chưa thành niên</div></div></div></div></div></div></div>"},{"k":28,"kicker":"Bài 1 · Mục 3.2","title":"Thời giờ làm việc của lao động chưa thành niên","sub":"Điều 146 Bộ luật Lao động 2019 — giữ nguyên mức tối đa <b>8 giờ/ngày, 40 giờ/tuần</b> như Bộ luật Lao động 2012","html":"<div class=\"m-box dark\" style=\"background:#0b463f\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffd75e\">NGƯỜI TỪ ĐỦ 15 TUỔI ĐẾN DƯỚI 18 TUỔI</div><div class=\"m-grid2\"><div class=\"m-cell\"><div class=\"t th\" style=\"font-size:30px;font-weight:800;color:#ffffff;line-height:1.15\">8<span> giờ</span></div><div class=\"t\" style=\"font-size:16px;color:#bfe2db\">tối đa mỗi ngày</div></div><div class=\"m-cell\"></div><div class=\"t th\" style=\"font-size:30px;font-weight:800;color:#ffffff;line-height:1.15\">40<span> giờ</span></div><div class=\"t\" style=\"font-size:16px;color:#bfe2db\">tối đa mỗi tuần</div></div><div class=\"t\" style=\"font-size:14.5px;color:#FFD75E;font-weight:600;background:rgba(245,179,1,.14);border:1px solid rgba(245,179,1,.45);border-radius:12px;padding:10px 12px;margin-top:10px\">Chỉ được làm thêm giờ và làm ban đêm trong <b>một số nghề, công việc</b> do Bộ LĐTBXH quy định</div></div></div><div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #1e8449\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#1e8449\">TÌNH HUỐNG ĐÚNG</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#1E8449\">Em 17 tuổi, thực tập tại cửa hàng điện lạnh <b>8 giờ/ngày, 5 ngày/tuần</b> → đúng quy định (40 giờ/tuần)</div><div class=\"li dot\" style=\"--c:#1E8449\">Được nghỉ giải lao giữa ca, được trang cấp PTBVCN đầy đủ</div><div class=\"li dot\" style=\"--c:#1E8449\">Chỉ thực hiện thao tác đã được huấn luyện, <b>có thợ chính giám sát</b></div><div class=\"li dot\" style=\"--c:#1E8449\">Được từ chối khi bị phân công leo cao lắp dàn nóng một mình</div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #c0392b\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c0392b\">TÌNH HUỐNG SAI — PHẢI TỪ CHỐI</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#C0392B\">Bị yêu cầu làm <b>10–12 giờ/ngày</b> để kịp tiến độ mùa nóng</div><div class=\"li dot\" style=\"--c:#C0392B\">Bị phân công làm ca đêm lắp đặt hệ thống lạnh công nghiệp</div><div class=\"li dot\" style=\"--c:#C0392B\">Bị giao <b>tự vận chuyển bình gas</b>, tự hàn ống đồng không có giám sát</div><div class=\"li dot\" style=\"--c:#C0392B\">Bị giao leo mái nhà, làm việc trên cao một mình không có dây an toàn</div></div></div></div></div>"},{"k":29,"kicker":"Bài 1 · Mục 4","title":"Tổng kết Bài 1","sub":"Những điều cốt lõi em phải nhớ sau bài học này","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #118577\"><div class=\"m-irow\"><span class=\"m-num\" style=\"color:#118577\">01</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#08312e\">ATLĐ chống yếu tố nguy hiểm — VSLĐ chống yếu tố có hại</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Một bên ngăn thương tật, tử vong tức thì; một bên ngăn bệnh tật tích lũy lâu dài.</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #0f6a5f\"><div class=\"m-irow\"><span class=\"m-num\" style=\"color:#0f6a5f\">02</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#08312e\">Mối nguy là bất cứ thứ gì có tiềm năng gây hại</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Định nghĩa ILO, tương ứng với “yếu tố nguy hiểm, yếu tố có hại” trong Luật ATVSLĐ 2015.</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #c0392b\"><div class=\"m-irow\"><span class=\"m-num\" style=\"color:#c0392b\">03</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#08312e\">Lao động trẻ có nguy cơ TNLĐ, BNN cao hơn 40%</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Do 4 nguyên nhân: thể chất, tâm lý, thiếu kinh nghiệm, thiếu đại diện tại nơi làm việc.</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #c98200\"><div class=\"m-irow\"><span class=\"m-num\" style=\"color:#c98200\">04</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#08312e\">NLĐ có 7 quyền và 4 nghĩa vụ về ATVSLĐ</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Đặc biệt: quyền từ chối công việc nguy hiểm mà vẫn được trả đủ lương.</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #118577\"><div class=\"m-irow\"><span class=\"m-num\" style=\"color:#118577\">05</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#08312e\">NSDLĐ có 7 nghĩa vụ và 4 quyền</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Phải huấn luyện, trang cấp PTBVCN, đóng bảo hiểm TNLĐ–BNN và không được ép buộc NLĐ.</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-left:5px solid #0f6a5f\"><div class=\"m-irow\"><span class=\"m-num\" style=\"color:#0f6a5f\">06</span><div class=\"m-irest\"><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#08312e\">Lao động dưới 18 tuổi được bảo vệ đặc biệt</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Tối đa 8 giờ/ngày, 40 giờ/tuần; cấm nhiều công việc và nơi làm việc nguy hiểm.</div></div></div></div><div class=\"m-box dark\" style=\"background:#0b463f\"><div class=\"t\" style=\"font-size:18px;color:#dff2ee\">Tiếp theo: <b style=\"color:#FFD75E\">8 câu hỏi trắc nghiệm</b> — bấm chọn đáp án để kiểm tra kiến thức và xem giải thích ngay tại lớp.</div></div>"},{"k":39,"kicker":"Bài 2","title":"Mục tiêu bài học","sub":"Sau khi học xong bài này, học sinh sẽ có khả năng:","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c98200\">KIẾN THỨC &amp; KĨ NĂNG</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li num\" style=\"--c:#C98200\"><span class=\"nb\">1</span><span class=\"nbt\">Trình bày được <b>khái niệm mối nguy</b>, các nhóm mối nguy và phương pháp xác định mối nguy hiệu quả trong nghề sửa chữa, bảo trì điện lạnh;</span></div><div class=\"li num\" style=\"--c:#C98200\"><span class=\"nb\">2</span><span class=\"nbt\">Xác định được các mối nguy tại nơi làm việc và <b>ảnh hưởng của chúng</b> đối với an toàn và sức khỏe của người lao động.</span></div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#edf8f6\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#118577\">THÁI ĐỘ</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#3FB5A3\">Coi trọng ATVSLĐ</div><div class=\"li dot\" style=\"--c:#3FB5A3\">Cẩn trọng đề phòng và phòng ngừa các mối nguy tại nơi làm việc</div><div class=\"li dot\" style=\"--c:#3FB5A3\">Nghiêm túc, tự giác tuân thủ nội quy, quy trình làm việc ATVSLĐ</div></div></div></div></div><div class=\"m-box dark\" style=\"background:#0b463f\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#ffd75e\">LỘ TRÌNH BÀI 2</div><div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><span class=\"m-badge\" style=\"background:#FFD75E;color:#08312E;\">1</span><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#ffffff\">Mối nguy là gì?</div><div class=\"t\" style=\"font-size:13.5px;color:#afd3cd\">Khái niệm theo ILO và Luật ATVSLĐ</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><span class=\"m-badge\" style=\"background:#FFD75E;color:#08312E;\">2</span><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#ffffff\">Phân loại 6 nhóm</div><div class=\"t\" style=\"font-size:13.5px;color:#afd3cd\">Vật lý, an toàn, hóa chất, sinh học, éc-gô-nô-mi, tâm lý</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><span class=\"m-badge\" style=\"background:#FFD75E;color:#08312E;\">3</span><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#ffffff\">Cách xác định</div><div class=\"t\" style=\"font-size:13.5px;color:#afd3cd\">Quan sát, kiểm tra, trao đổi, tra hồ sơ</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><span class=\"m-badge\" style=\"background:#FFD75E;color:#08312E;\">4</span><div class=\"t th\" style=\"font-size:15px;font-weight:700;color:#ffffff\">Thực hành nhóm</div><div class=\"t\" style=\"font-size:13.5px;color:#afd3cd\">Nhận diện mối nguy qua ảnh và tại xưởng</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:rgba(255,255,255,0.10)\"><span class=\"m-badge\" style=\"background:#FFD75E;color:#08312E;\">5</span><div class=\"t\" style=\"font-size:13.5px;font-weight:700;color:#ffffff\">5 nhóm mối nguy đặc thù</div><div class=\"t\" style=\"font-size:13.5px;color:#afd3cd\">Chi tiết từng mối nguy của nghề điện lạnh</div></div></div></div><div class=\"t\" style=\"font-size:16px;color:#dff2ee\">Bài 2 trả lời câu hỏi <b style=\"color:#FFD75E\">“Điều gì có thể gây hại cho em?”</b> — Bài 3 sẽ trả lời <b style=\"color:#FFD75E\">“Làm thế nào để phòng tránh?”</b></div></div>"},{"k":40,"kicker":"Bài 2 · Mục 1.1","title":"Mối nguy là gì?","sub":"","html":"<div class=\"m-box dark\" style=\"background:#0b463f\"><div class=\"t\" style=\"font-size:18px;color:#ffffff\">“Mối nguy là <b style=\"color:#FFD75E\">bất cứ thứ gì có tiềm năng gây hại</b> hoặc có ảnh hưởng tiêu cực đối với sức khỏe của con người — gây chấn thương, ốm đau, bệnh tật, tử vong hoặc các tổn thương khác.”</div><div class=\"t\" style=\"font-size:15px;color:#3fb5a3\">— Tổ chức Lao động Quốc tế (ILO)</div></div><div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#edf8f6;border:1px solid #3fb5a3\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#118577\">ĐIỂM QUAN TRỌNG: “TIỀM NĂNG”</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Mối nguy <b>chưa gây hại</b> nhưng <b>có khả năng gây hại</b>. Dây điện hở vỏ nằm trên sàn khô chưa gây điện giật — nhưng nó vẫn là mối nguy.</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#fff6de;border:1px solid #f5b301\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c98200\">LIÊN HỆ LUẬT VIỆT NAM</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">“Mối nguy” (ILO) tương ứng với cụm từ <b>“yếu tố nguy hiểm, yếu tố có hại”</b> trong Luật ATVSLĐ 2015 của Việt Nam.</div></div></div></div><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#118577\">PHÂN BIỆT 3 KHÁI NIỆM DỄ NHẦM</div><div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #118577\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#118577\">MỐI NGUY</div><div class=\"t\" style=\"font-size:15px\">Thứ có tiềm năng gây hại</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">VD: Bình gas R600a để cạnh chỗ hàn</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #c98200\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c98200\">NGUY CƠ / RỦI RO</div><div class=\"t\" style=\"font-size:15px\">Khả năng mối nguy thực sự gây hại</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">VD: Khả năng gas bắt lửa gây nổ</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #c0392b\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c0392b\">TAI NẠN</div><div class=\"t\" style=\"font-size:15px\">Sự việc đã xảy ra, gây tổn thương</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">VD: Bình gas nổ, thợ bị bỏng nặng</div></div></div></div>"},{"k":41,"kicker":"Bài 2 · Mục 1.2","title":"Phân loại 6 nhóm mối nguy","sub":"Cách phân loại theo ILO — nghề điện lạnh gặp đủ cả 6 nhóm","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #0f6a5f\"><div class=\"m-irow\"><span class=\"m-badge emo\" style=\"background:#EDF8F6;\">🌡</span><div class=\"m-irest\"><div class=\"t\" style=\"font-size:13.5px;font-weight:700;color:#4a6a66\">NHÓM 1</div><div class=\"t th\" style=\"font-size:18px;font-weight:800;color:#0f6a5f\">VẬT LÝ</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Bụi, tiếng ồn, rung động, ánh sáng, độ ẩm, nhiệt độ quá cao/thấp, bức xạ</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #c0392b\"><div class=\"m-irow\"><span class=\"m-badge emo\" style=\"background:#EDF8F6;\">⚡</span><div class=\"m-irest\"><div class=\"t\" style=\"font-size:13.5px;font-weight:700;color:#4a6a66\">NHÓM 2</div><div class=\"t th\" style=\"font-size:18px;font-weight:800;color:#c0392b\">AN TOÀN</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Mối nguy có khả năng gây chấn thương <b>ngay lập tức</b> nếu không kiểm soát phù hợp</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #c98200\"><div class=\"m-irow\"><span class=\"m-badge emo\" style=\"background:#EDF8F6;\">🧪</span><div class=\"m-irest\"><div class=\"t\" style=\"font-size:13.5px;font-weight:700;color:#4a6a66\">NHÓM 3</div><div class=\"t th\" style=\"font-size:18px;font-weight:800;color:#c98200\">HÓA CHẤT</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Tiếp xúc hóa chất ở dạng khí, bụi, khói, hơi và chất lỏng</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #1e8449\"><div class=\"m-irow\"><span class=\"m-badge emo\" style=\"background:#EDF8F6;\">🦠</span><div class=\"m-irest\"><div class=\"t\" style=\"font-size:13.5px;font-weight:700;color:#4a6a66\">NHÓM 4</div><div class=\"t th\" style=\"font-size:18px;font-weight:800;color:#1e8449\">SINH HỌC</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Vi khuẩn, ký sinh trùng, nấm mốc, vi rút, động vật, côn trùng, thực vật</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #118577\"><div class=\"m-irow\"><span class=\"m-badge emo\" style=\"background:#EDF8F6;\">🏃</span><div class=\"m-irest\"><div class=\"t\" style=\"font-size:13.5px;font-weight:700;color:#4a6a66\">NHÓM 5</div><div class=\"t th\" style=\"font-size:18px;font-weight:800;color:#118577\">ÉC-GÔ-NÔ-MI</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Tư thế, thao tác, gánh nặng công việc: nâng vác nặng, thao tác lặp lại, thiết kế không phù hợp</div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #7d3c98\"><div class=\"m-irow\"><span class=\"m-badge emo\" style=\"background:#EDF8F6;\">🧠</span><div class=\"m-irest\"><div class=\"t\" style=\"font-size:13.5px;font-weight:700;color:#4a6a66\">NHÓM 6</div><div class=\"t th\" style=\"font-size:18px;font-weight:800;color:#7d3c98\">TÂM LÝ</div></div></div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Tổ chức nơi làm việc, thiết kế công việc, bố trí lao động không hợp lý → căng thẳng, ức chế, trầm cảm</div></div></div></div>"},{"k":42,"kicker":"Bài 2 · Mục 1.2.1 – 1.2.2","title":"Nhóm mối nguy Vật lý và An toàn","sub":"","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #0f6a5f\"><div class=\"t th\" style=\"font-size:18px;font-weight:800;color:#0f6a5f\">MỐI NGUY VẬT LÝ</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Tiếp xúc với các <b>tác nhân vật lý</b> khác nhau có thể gây ảnh hưởng tới sức khỏe người lao động.</div><div class=\"t\" style=\"font-size:13.5px;font-weight:800;color:#118577\">CÁC TÁC NHÂN THƯỜNG GẶP</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#3FB5A3\">Bụi</div><div class=\"li dot\" style=\"--c:#3FB5A3\">Tiếng ồn</div><div class=\"li dot\" style=\"--c:#3FB5A3\">Rung động</div><div class=\"li dot\" style=\"--c:#3FB5A3\">Một số loại ánh sáng</div><div class=\"li dot\" style=\"--c:#3FB5A3\">Độ ẩm cao</div><div class=\"li dot\" style=\"--c:#3FB5A3\">Nhiệt độ quá cao hoặc quá thấp</div><div class=\"li dot\" style=\"--c:#3FB5A3\">Bức xạ</div></div><div class=\"m-box\" style=\"background:#edf8f6\"><div class=\"t\" style=\"font-size:15px;color:#0f6a5f\">Trong nghề điện lạnh: bụi khi khoan tường, tiếng ồn máy nén, rung máy khoan, nhiệt từ ngọn lửa hàn.</div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #c0392b\"><div class=\"t th\" style=\"font-size:18px;font-weight:800;color:#c0392b\">MỐI NGUY AN TOÀN</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Là mối nguy có khả năng gây ra <b>chấn thương ngay lập tức</b> nếu không có các biện pháp kiểm soát phù hợp.</div><div class=\"t\" style=\"font-size:13.5px;font-weight:800;color:#c0392b\">ĐẶC ĐIỂM NHẬN BIẾT</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#C0392B\">Hậu quả xuất hiện <b>tức thì</b>, không có thời gian tích lũy</div><div class=\"li dot\" style=\"--c:#C0392B\">Thường liên quan tới <b>năng lượng</b>: điện, cơ, nhiệt, áp suất</div><div class=\"li dot\" style=\"--c:#C0392B\">Có thể gây <b>tử vong</b> chỉ trong một sai sót nhỏ</div><div class=\"li dot\" style=\"--c:#C0392B\">Phòng ngừa phải <b>làm trước</b>, không thể khắc phục sau</div></div><div class=\"m-box\" style=\"background:#fbe4e1\"><div class=\"t\" style=\"font-size:15px;color:#c0392b\">Trong nghề điện lạnh: điện giật khi đấu nối, ngã từ thang, vật sắc nhọn, nổ bình gas.</div></div></div></div></div>"},{"k":43,"kicker":"Bài 2 · Mục 1.2.3 – 1.2.4","title":"Nhóm mối nguy Hóa chất và Sinh học","sub":"","html":"<div class=\"m-stack\"><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #c98200\"><div class=\"t th\" style=\"font-size:18px;font-weight:800;color:#c98200\">MỐI NGUY HÓA CHẤT</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Bao gồm tiếp xúc với hóa chất ở <b>5 dạng</b>: khí, bụi, khói, hơi và chất lỏng.</div><div class=\"m-box\" style=\"background:#fff6de\"><span class=\"m-num\" style=\"color:#c98200\">Khí</span><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Gas lạnh rò rỉ, CO, CO₂ từ khói hàn</div></div><div class=\"m-box\" style=\"background:#fff6de\"><span class=\"m-num\" style=\"color:#c98200\">Bụi</span><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Bụi hóa chất từ vật liệu cách nhiệt</div></div><div class=\"m-box\" style=\"background:#fff6de\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c98200\">Khói</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Khói hàn chứa oxit kim loại, fosgen</div></div><div class=\"m-box\" style=\"background:#fff6de\"><span class=\"m-num\" style=\"color:#c98200\">Hơi</span><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Hơi dung môi sơn cách điện, hơi dầu</div></div><div class=\"m-box\" style=\"background:#fff6de\"><div class=\"t th\" style=\"font-size:15px;font-weight:800;color:#c98200\">Chất lỏng</div><div class=\"t\" style=\"font-size:13.5px;color:#4a6a66\">Dầu bôi trơn, sơn cách điện, chất tẩy rửa</div></div><div class=\"m-box\" style=\"background:#edf8f6\"><div class=\"t\" style=\"font-size:13.5px;color:#0f6a5f\">Hóa chất xâm nhập cơ thể qua 3 đường: <b>hô hấp</b> (hít vào), <b>da</b> (thấm qua), <b>tiêu hóa</b> (ăn uống tại nơi làm việc).</div></div></div></div><div class=\"m-cell\"><div class=\"m-box\" style=\"background:#ffffff;border:1px solid #cbdfdb;border-top:5px solid #1e8449\"><div class=\"t th\" style=\"font-size:18px;font-weight:800;color:#1e8449\">MỐI NGUY SINH HỌC</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\">Bao gồm tiếp xúc với các sinh vật và sản phẩm của chúng có thể gây bệnh cho người lao động.</div><div class=\"t\" style=\"font-size:13.5px;font-weight:800;color:#1e8449\">CÁC TÁC NHÂN</div><div class=\"t\" style=\"font-size:15px;color:#4a6a66\"><div class=\"li dot\" style=\"--c:#1E8449\">Vi khuẩn</div><div class=\"li dot\" style=\"--c:#1E8449\">Ký sinh trùng</div><div class=\"li dot\" style=\"--c:#1E8449\">Nấm mốc</div><div class=\"li dot\" style=\"--c:#1E8449\">Vi rút</div><div class=\"li dot\" style=\"--c:#1E8449\">Động vật nguy hiểm</div><div class=\"li dot\" style=\"--c:#1E8449\">Côn trùng</div><div class=\"li dot\" style=\"--c:#1E8449\">Thực vật</div></div><div class=\"m-box\" style=\"background:#e4f4e9\"><div class=\"t\" style=\"font-size:15px;color:#1e8449\">Trong nghề điện lạnh: <b>nấm mốc, vi khuẩn trong lưới lọc và dàn lạnh</b> lâu ngày không vệ sinh; chuột, côn trùng, phân chim khi làm việc ở gầm trần, mái nhà, sân thượng.</div></div></div></div></div>"},{"k":44,"kicker":"Bài 2 · Mục 1.2.5 – 1.2.6","title":"Nhóm mối nguy Éc-gô-nô
